<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" role="img" aria-label="Quimicalizada Rush · A04"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2134"/><stop offset="1" stop-color="#0a1122"/></linearGradient></defs><rect x="0" y="0" width="940" height="628" fill="url(#bg)" rx="18"/><text x="24" y="38" font-size="23" font-weight="800" fill="#f8df8c">Quimicalizada Rush · A04</text><text x="24" y="70" font-size="15" fill="#7cdded">PENDIENTE_DE_VERIFICACION · Guía documental; no certifica legalidad</text><rect x="27" y="108" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="156" r="23" fill="#087a98"/><text x="69" y="163" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">1</text><text x="110" y="135" fill="#e9f9ff" font-size="17">Ubicar las tres copias de Salamandra Alquimicalizada en el Extra.</text><path d="M470 207 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="228" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="276" r="23" fill="#087a98"/><text x="69" y="283" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">2</text><text x="110" y="255" fill="#e9f9ff" font-size="17">Comprobar materiales exactos, método de invocación y texto real de «Fusión».</text><path d="M470 327 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="348" width="885" height="96" fill="#122f48" stroke="#e5bd55" rx="12"/><circle cx="69" cy="396" r="23" fill="#087a98"/><text x="69" y="403" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">3</text><text x="110" y="375" fill="#e9f9ff" font-size="17">Usar la Skill en turno &gt;=2 SOLO para buscar cartas que sean objetivos legales; no</text><text x="110" y="398" fill="#e9f9ff" font-size="17">asumir que ya se poseen los materiales.</text><path d="M470 447 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="468" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="516" r="23" fill="#087a98"/><text x="69" y="523" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">4</text><text x="110" y="495" fill="#e9f9ff" font-size="17">Invocar la Fusión únicamente si todos los requisitos y las zonas de Rush Duel están</text><text x="110" y="518" fill="#e9f9ff" font-size="17">satisfechos.</text></svg>