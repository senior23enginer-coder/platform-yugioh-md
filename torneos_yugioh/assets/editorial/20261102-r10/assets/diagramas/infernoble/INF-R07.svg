<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1106" role="img" aria-label="Guía visual Renaud propio sí se vuelve Cantante"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  INF-R07  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Renaud propio sí se vuelve Cantante</text><rect x="45" y="126" width="984" height="86" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Un Guerrero FUEGO propio en campo, Renaud en mano, no se utilizó su Invocación propia</text><path d="M 537 215 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 234 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="247" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="276" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="306" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca Especialmente Renaud de la mano por su condición.</text><path d="M 537 336 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 355 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="368" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="397" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  DESTIERRO</text><text x="74" y="427" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Al venir de este modo se trata como Cantante; recupera Equipo o Guerrero FUEGO del GY/destierro con efecto</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">separado si hay blanco.</text><path d="M 537 480 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 499 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="512" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="541" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="571" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Suma sus niveles con los del Guerrero no Cantante y otros materiales efectivamente controlados.</text><path d="M 537 601 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 620 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="633" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="662" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  SINCRONÍA</text><text x="74" y="692" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sólo realiza una Sincronía cuya suma y materiales correspondan al Extra real; si no, conserva material y</text><text x="74" y="715" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Equipo para siguiente vuelta.</text><path d="M 537 745 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 765 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="779" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="808" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="838" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Objetivo: Renaud propio sí se vuelve Cantante. Confirmar estado final y restricciones conforme a cada</text><text x="74" y="861" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">paso.</text><rect x="45" y="909" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="938" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="968" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">El nivel de 1 de Renaud no alcanza por sí solo a Angélica/Carlos; tampoco repetir el efecto de</text><text x="74" y="991" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">recuperación de Renaud ya usado. PRUEBA DE REGLAS: El Guerrero acompañante y un Nivel compatible deben</text><text x="74" y="1014" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">existir realmente antes de afirmar cualquier Synchro del Extra.</text><text x="48" y="1076" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1099" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
