<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual E-C | FIRE WARRIOR + RENAUD"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  E-C  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">E-C | FIRE WARRIOR + RENAUD</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Campo: Infernoble Caballero Ogier FIRE Guerrero Nivel4. Mano: Renaud Nivel1; Extra: Infernoble Knight</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Captain Roland Nivel5. Hay una Mágica de Equipo y un Guerrero en Deck para la End Phase.</text><path d="M 537 238 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Controlando Ogier (Guerrero FUEGO Nivel4), Invoca Especialmente Infernoble Knight - Renaud desde la</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mano usando su propia condición.</text><path d="M 537 382 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Por haber sido Invocado exactamente de esta forma, Renaud se TRATA como Cantante Nivel1. Su</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">recuperación de Guerrero FIRE/Mágica Equipo del GY es opcional, solo si existe objetivo real.</text><path d="M 537 526 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Haz Invocación por Sincronía: Ogier No Cantante Nivel4 + Renaud Cantante Nivel1 = Captain Roland Nivel5</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desde tu Extra.</text><path d="M 537 670 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si Captain Roland fue Invocado por Sincronía, activa su disparador. ESTA ACTIVACIÓN todavía no añade</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Guerrero ni envía Mágica: crea una operación diferida para la End Phase.</text><path d="M 537 814 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Durante la End Phase de este turno, si el efecto diferido puede ejecutarse, ENVÍA 1 Mágica de Equipo</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Deck al GY, DESPUÉS añade 1 monstruo Guerrero del Deck a tu mano.</text><path d="M 537 958 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Captain Roland Nivel5 ocupa campo; cuando llegue End Phase puede generar exactamente un envío de Equipo y</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">búsqueda de Guerrero. No hay búsqueda anticipada en Main Phase.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Renaud no es Cantante si se invoca de otro modo; si Ogier no está en campo antes de la autoInvocación,</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Renaud no entra por esa condición; sin Mágica de Equipo en Deck o sin Guerrero buscable, no afirmar una</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">End Phase exitosa.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
