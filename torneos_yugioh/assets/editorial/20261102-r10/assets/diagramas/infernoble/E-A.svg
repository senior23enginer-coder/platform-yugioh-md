<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual E-A | CONNECTOR + DOLPHIN -&gt; DOS WARRIORS"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  E-A  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">E-A | CONNECTOR + DOLPHIN -&gt; DOS WARRIORS</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Neo Space Connector; Normal libre. Deck: Aqua Dolphin, 1 Isolde disponible en Extra, 1 Equip Spell</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(por ejemplo Divine Sword - Phoenix Blade) y Renaud Nivel 1 en Deck.</text><path d="M 537 238 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente Neo Space Connector (LIGHT / Warrior / Nivel 4).</text><path d="M 537 359 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver su efecto de Invocación Normal, Invoca Aqua Dolphin (WATER / Warrior / Nivel 3) desde Deck</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en Defensa.</text><path d="M 537 503 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Es opcional usar el efecto de Dolphin: descarta 1 carta para mirar mano rival y aplicar su comparación</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de ATK; NO cuenta como negación automática. Para esta ruta no es necesario activarlo.</text><path d="M 537 647 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Usa Connector + Dolphin (ambos Warrior) como materiales Link para Isolde, Two Tales of the Noble</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Knights. No actives su búsqueda opcional de Warrior si piensas Invocar luego exactamente ese nombre.</text><path d="M 537 791 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Activa Isolde: envía 1 Equip Spell de nombre único de Deck a Cementerio (por ejemplo Divine Sword -</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Phoenix Blade) para Invocar Renaud (Warrior / Nivel 1) desde Deck.</text><path d="M 537 935 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si Phoenix Blade continúa en Cementerio, el efecto de Renaud al ser Invocado Especialmente puede</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">seleccionarla y recuperarla a la mano. Terminas con Isolde + Renaud, sin prometer otras extensiones.</text><path d="M 537 1079 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Isolde Link-2 y Renaud Nivel 1 en campo; Equip Spell recuperable en mano si resolvió el disparador de</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Renaud. Consumió Normal; no requirió cartas ajenas al Deck registrado.</text><rect x="45" y="1243" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">La negación de Connector impide traer Dolphin. Si Aqua Dolphin ya no está en mano/Deck, no hay dos</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Warriors en este camino. Si falta Equip Spell en Deck o Renaud, el efecto de Isolde no produce la</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">extensión. No buscar con Isolde el nombre que luego se Invocará.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
