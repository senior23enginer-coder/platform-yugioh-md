<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1486" role="img" aria-label="Guía visual E-D | ANGELICA -&gt; ROLAND / CARLOS (CONDICIONAL)"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  E-D  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">E-D | ANGELICA -&gt; ROLAND / CARLOS (CONDICIONAL)</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Main Phase propia: Angelica, Princess of Noble Arms Sincronía Nivel5 campo; otro Guerrero NO CANTANTE</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel4 (Ogier) campo; rival activa un efecto que SELECCIONA Angelica; Deck FIRE Warrior, Extra: Captain</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Roland y Emperor Charles.</text><path d="M 537 261 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. El rival activa efecto dirigido a Angelica en campo. Responde con efecto rápido de Angelica en la</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cadena apropiada.</text><path d="M 537 405 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver, ENVÍA 1 Guerrero FUEGO del Deck al GY; si lo hiciste, DESTIERRA Angelica temporalmente</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">hasta End Phase y puedes Invocar desde Extra Captain Roland Nivel5 (Sincronía Cantante).</text><path d="M 537 549 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. El Captain Roland traído por Angelica NO fue INVOCADO POR SINCRONÍA: NO se dispara su efecto que exige</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">esa clase de Invocación para una búsqueda posterior.</text><path d="M 537 693 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si Ogier Nivel4 NO Cantante sigue en campo y estás en Main Phase con Invocación por Sincronía</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permitida, usa Captain Roland Cantante Nivel5 + Ogier Nivel4 para Invocar Infernoble Knight Emperor</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Charles Nivel9.</text><path d="M 537 860 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTIERRO</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. No inventar una búsqueda inmediata de Roland ni decir que Angelica vuelve del destierro como material:</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mientras está fuera no es material disponible.</text><path d="M 537 1004 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si el disparador de Angelica fue causado por ataque en Battle Phase, la conversión a Carlos NO puede</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">suceder sin oportunidad posterior de Invocación Sincronía en una Main Phase legal.</text><path d="M 537 1148 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1168 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1182" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1211" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Angelica puede evadir un objetivo, enviar FIRE Warrior de Deck, traer Captain Roland y, solo con otro</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel4 disponible y fase legal, producir Emperor Charles Nivel9.</text><rect x="45" y="1312" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1341" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No hubo selección de Angelica por efecto/ataque, no queda FIRE Warrior en Deck, Roland no está Extra,</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Ogier no está presente, o se encuentra en Battle Phase; entonces el remate Carlos no está asegurado.</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
