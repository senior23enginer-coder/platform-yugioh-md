<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1486" role="img" aria-label="Guía visual Connector -&gt; Isolda -&gt; Renaud, sin falso Cantante"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  INF-R06  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Connector -&gt; Isolda -&gt; Renaud, sin falso Cantante</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Neo Space Connector; Normal disponible. Deck: Neo-Spacian Aqua Dolphin, un Equipo (Phoenix Blade,</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">por ejemplo), Infernoble Renaud. Extra: Isolde Link2.</text><path d="M 537 238 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca NORMALMENTE Neo Space Connector Guerrero Nivel4. Al resolver su disparador trae Aqua Dolphin</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Guerrero Nivel3 desde Deck a Defensa.</text><path d="M 537 382 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Con AMBOS Guerreros en campo, Invoca por ENLACE Isolde Link2; envía Connector y Dolphin al GY como</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales.</text><path d="M 537 526 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Isolde puede buscar un Guerrero del Deck a mano al Link; SI lo haces, NO podrás Invocar Normal/Especial</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ni activar efectos del monstruo con ese nombre en este turno. Por eso NO busques Renaud si vas a traerlo</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">con el segundo efecto.</text><path d="M 537 693 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. En el segundo efecto de Isolde envía exactamente UNA Mágica de Equipo del Deck al GY como COSTE; al</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">resolver Invoca desde Deck un Guerrero Nivel1: Renaud.</text><path d="M 537 837 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Renaud llega por Isolde, NO por su condición de autoInvocación desde mano: sigue siendo NO CANTANTE. Si</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">existe Mágica Equipo o Guerrero FIRE en GY/destierro, su efecto opcional de recuperación puede tener</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">objetivo.</text><path d="M 537 1004 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  SINCRONÍA</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. No declares Sincronía de Nivel5 con Isolde (Link no tiene nivel) + Renaud NO Cantante, ni trates el</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Equipo enviado como un cuerpo adicional.</text><path d="M 537 1148 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1168 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1182" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1211" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Connector→Dolphin→Isolde y envío de 1 Equipo pueden generar Renaud desde Deck, sin convertir Renaud en</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cantante; el nombre buscado por Isolde queda restringido.</text><rect x="45" y="1312" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1341" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Connector negado, Dolphin no disponible, Equip en Deck agotado, Renaud en mano en vez de Deck o buscar</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Renaud con primer efecto de Isolde invalidan la ruta descrita.</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
