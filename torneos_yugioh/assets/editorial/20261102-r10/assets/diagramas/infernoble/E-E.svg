<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual E-E | FENRIR Y EL RIESGO DE RISEHEART"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  E-E  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">E-E | FENRIR Y EL RIESGO DE RISEHEART</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Kashtira Fenrir + Kashtira Riseheart. Campo vacío; este deck Infernoble tiene Synchro/Link como</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">objetivos principales de Extra.</text><path d="M 537 238 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Fenrir con campo propio vacío; esto no te impone por sí mismo limitación de tipos</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Extra.</text><path d="M 537 382 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  BÚSQUEDA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Fenrir puede buscar otro Kashtira en tu Main Phase, si su búsqueda no se gastó. En esta demostración</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Riseheart YA está en mano.</text><path d="M 537 526 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. DECISIÓN: si Invocas Especialmente Riseheart desde mano por controlar a Fenrir, su propio texto te</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">limita a Invocar solamente monstruos XYZ desde Extra por el RESTO del turno.</text><path d="M 537 670 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. No pretendas que ese mismo turno puedas después hacer Link Isolde, Synchro Angelica o Emperor Charles;</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">el bloqueo aplicado al usar la autoInvocación especial de Riseheart impide esas Invocaciones desde Extra.</text><path d="M 537 814 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Ruta conservadora: NO actives la autoInvocación de Riseheart cuando tu plan principal sea Link/Synchro;</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">puedes conservar Fenrir y seguir una línea Warrior independiente si tienes recursos auténticos.</text><path d="M 537 958 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Se verificó el choque real Fenrir/Riseheart con un Extra orientado a Link/Synchro. Fenrir sigue utilizable</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como presión; Riseheart solo se incorpora voluntariamente si aceptas el turno Xyz.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No concluir que Riseheart cambia al Nivel7 de manera automática; requiere otra activación que destierra</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">una carta Kashtira del Deck. Si la Invocación Especial de Riseheart ya aplicó su restricción, retirar</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Riseheart no la elimina.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
