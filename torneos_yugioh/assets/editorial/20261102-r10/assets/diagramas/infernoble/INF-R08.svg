<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1653" role="img" aria-label="Guía visual Ruta de decisión ante Kashtira y bloqueo Xyz"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  INF-R08  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Ruta de decisión ante Kashtira y bloqueo Xyz</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Infernoble: mano Kashtira Fenrir y Neo Space Connector; Deck contiene Aqua Dolphin, Renaud, Equip Spell y</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Kashtira Riseheart; Extra contiene Isolde. Campo propio inicialmente vacío y Normal libre. Rival Kashtira</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">sin efecto inhibidor aplicado todavía.</text><path d="M 537 261 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Fenrir de tu mano al campo vacío. NO gastas Normal y Fenrir no prohíbe</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">invocaciones Link o Sincronía.</text><path d="M 537 405 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En Main Phase usa Fenrir para AÑADIR Riseheart del Deck a la mano, si sigue disponible. No lo Invocas</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">aún.</text><path d="M 537 549 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Invoca Normal Neo Space Connector e Invoca Aqua Dolphin desde Deck al resolver su disparador.</text><path d="M 537 670 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Usa los DOS Guerreros (Connector + Dolphin) para Link Summon Isolde del Extra; Fenrir es Psíquico, no</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">es el segundo material Guerrero.</text><path d="M 537 814 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si quieres, activa Isolde enviando 1 Equip Spell desde Deck al GY como coste para Invocar a Renaud</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel1. No prometas otro jefe ni negar Fenrir rival: conserva el campo realmente resultante.</text><path d="M 537 958 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si Invocas Especialmente Riseheart de la mano mediante su condición mientras Fenrir permanece, quedarás</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">restringido a SOLO monstruos Xyz desde Extra durante el RESTO del turno. Por eso deja esa decisión para</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">después de los Link/Sincronías que realmente pretendas hacer.</text><path d="M 537 1125 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1144 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1157" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1186" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 07  /  ACTIVACIÓN</text><text x="74" y="1216" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">7. Contra Fenrir rival, respeta la activación concreta: puede desterrar una carta propia boca arriba</text><text x="74" y="1239" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cuando se cumple su condición y puede seleccionar legalmente. No se activa en cualquier ventana del turno</text><text x="74" y="1262" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">solo por estar boca arriba.</text><path d="M 537 1292 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1312 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1326" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1355" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1385" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fenrir propio + Isolde Link2 + Renaud si Isolde resolvió; Riseheart queda en mano hasta elegir su</text><text x="74" y="1408" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">restricción. Esta línea no altera ninguna de las 42 cartas Infernoble.</text><rect x="45" y="1456" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1485" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Fenrir no puede Invocarse por campo vacío o Riseheart no está en Deck, falta acceso; Connector negado</text><text x="74" y="1538" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no trae Dolphin; sin Equip Spell o Renaud en Deck, Isolde no extiende; Shifter/reemplazo de GY puede</text><text x="74" y="1561" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">impedir coste de envío.</text><text x="48" y="1623" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1646" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
