<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual E-B | WANTED -&gt; DIABELLSTAR -&gt; ORIGINAL SINFUL SPOILS"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#61321f" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ef9b59"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">INFERNOBLE  ·  E-B  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">E-B | WANTED -&gt; DIABELLSTAR -&gt; ORIGINAL SINFUL SPOILS</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: WANTED y una OTRA carta descartable. Deck: Diabellstar, Botín del Pecado Original - Ojo de</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Serpiente, Renaud. Campo inicial despejado y Main Phase.</text><path d="M 537 238 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  BÚSQUEDA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa WANTED desde mano; al resolver, busca Diabellstar la Bruja Negra del Deck y añádela a mano.</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">WANTED pasa al GY.</text><path d="M 537 382 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Invoca Especialmente Diabellstar desde mano por su propio procedimiento: ENVÍA otra carta de mano o</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">campo al GY. No uses WANTED que ya está en GY como si estuviera en mano.</text><path d="M 537 526 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Por haberse Invocado, Diabellstar coloca desde Deck una Mágica/Trampa Botín del Pecado: coloca Botín</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Pecado Original – Ojo de Serpiente (Mágica NORMAL).</text><path d="M 537 670 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Activa en Main Phase la Mágica Normal recién colocada. Envía como COSTE 1 carta propia boca arriba al</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">GY (por ejemplo, Diabellstar), antes de que el rival responda.</text><path d="M 537 814 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si resuelve, Invoca Especialmente desde Deck 1 monstruo FIRE Nivel1 REAL: Renaud. Fue Invocado por Ojo</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de Serpiente, NO por su propia condición; por tanto NO pasa a ser Cantante automáticamente.</text><path d="M 537 958 v 29" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  SINCRONÍA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si Renaud tiene objetivo de su recuperación en el GY/destierro (Guerrero FIRE o Mágica Equipo), puede</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activarse; si no, no inventar una búsqueda o una Sincronía posterior.</text><path d="M 537 1102 v 30" stroke="#ef9b59" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#ef9b59" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">WANTED + una segunda carta disponibles conducen a Renaud desde Deck, con Diabellstar enviada al GY como</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">pago de Ojo de Serpiente; Renaud NO es Cantante por esa vía.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin carta adicional para invocar Diabellstar, sin Ojo de Serpiente en Deck, sin un FIRE Nivel1 disponible</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en Deck, o si se niega una etapa, no se completa. El hechizo recién colocado es NORMAL, no Trampa.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
