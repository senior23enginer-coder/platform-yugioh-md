<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1509" role="img" aria-label="Guía visual TR04 | Tiagrimientos Kashtira -&gt; invocar rápido / envío"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR04  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR04 | Tiagrimientos Kashtira -&gt; invocar rápido / envío</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Main Phase de cualquiera de los jugadores, Tearlaments Kashtira Nivel7 PSÍQUICO AGUA en mano y una carta</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">«Kashtira» o «Tearlaments» desterrable de propia mano o GY. Hay Deck con al menos 3 cartas y se dispone de</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">zona de monstruo libre.</text><path d="M 537 261 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Durante Main Phase, activa el Efecto Rápido de Tearlaments Kashtira desde mano. NO es un monstruo Aqua;</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">su tipo impreso es Psychic.</text><path d="M 537 405 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver, Invócala Especialmente desde mano; SI se Invocó, destierra 1 carta Kashtira/Tear de tu</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mano o GY. El destierro no sucede antes como coste de activación.</text><path d="M 537 549 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Esa Invocación abre un disparador NUEVO de Tearlaments Kashtira (una vez por turno): elige mandar 3</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cartas superiores de TU Deck o del Deck rival al GY. No se envían ambas pilas.</text><path d="M 537 693 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si entre las tres propias cae Scheiren/Havnis/Merrli por efecto y quedan materiales legales, sus</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">disparadores opcionales pueden abrir Fusion en cadenas posteriores. El envío no garantiza ningún nombre</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">específico.</text><path d="M 537 860 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. El efecto distinto de Tearlaments Kashtira al SER ENVIADA al GY por efecto manda 2 cartas de TU Deck al</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">GY; no se activa por solo Invocarla ni por desterrarla.</text><path d="M 537 1004 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si está activo reemplazo de envío a GY por destierro, las cartas mandadas no llegarán normalmente a GY:</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">revisar condiciones antes de afirmar Fusión o disparadores.</text><path d="M 537 1148 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1168 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1182" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1211" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments Kashtira puede entrar como Efecto Rápido en Main Phase y enviar 3 superiores de uno de los</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Decks, pagando destierro DESPUÉS de Invocar al resolver.</text><rect x="45" y="1312" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1341" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin carta Kashtira/Tear para desterrar (mano/GY) no completes resolución como si fuera gratis; si niegan</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">el efecto de Invocación no hay nuevo monstruo ni disparador; ninguna carta específica está garantizada por</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mill aleatorio.</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1502" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
