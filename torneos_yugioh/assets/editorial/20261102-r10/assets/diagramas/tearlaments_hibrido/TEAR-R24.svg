<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual Reinoheart envía Scheiren: el problema de materiales"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TEAR-R24  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Reinoheart envía Scheiren: el problema de materiales</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: Reinoheart Nivel4 GUERRERO en mano, Normal libre; Scheiren de 1 copia en Deck y, solo</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">para posible Garura, Havnis Aqua OSCURIDAD en GY; Garura en Extra.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente Reinoheart. Su efecto de Invocación puede enviar al GY desde Deck un monstruo</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">«Tearlaments» distinto del propio Reinoheart; elige Scheiren si está realmente en Deck.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  FUSIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Scheiren llega al GY POR EFECTO, por lo que puede activar, en cadena nueva, su efecto que fusiona</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">utilizando ella misma como material desde GY y otros materiales reales de mano, campo o GY.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Reinoheart es un monstruo GUERRERO AGUA, NO Aqua: no cumple por sí solo el requisito de dos Aqua de</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Kaleido-Heart.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Kaleido-Heart exige Reinoheart + DOS monstruos Aqua. Si no tienes ambos Aqua además de Reinoheart, no</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">intentes declararla por tener solo Reinoheart y Scheiren.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  FUSIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Como alternativa CONDICIONAL, si Havnis (Aqua OSCURIDAD) está en tu GY, Scheiren (Aqua OSCURIDAD) +</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Havnis, con nombres distintos, permiten Fusionar Garura del Extra.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Devuelve al fondo del Deck Scheiren y los demás materiales usados según texto Tearlaments; si falta</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Havnis u otra combinación para cualquier Fusión del Extra, NO nace monstruo de Fusión.</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Reinoheart manda exactamente una Scheiren al GY; la Fusión no está garantizada. Garura es posible con</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Havnis u otra Aqua OSCURIDAD distinta apropiada presente.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scheiren no puede ser elegida desde el Deck si su única copia está en mano/GY. No fusiona si no queda</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">objetivo y materiales compatibles. Reinoheart no es Aqua; Kaleido-Heart necesita dos Aqua adicionales.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
