<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1486" role="img" aria-label="Guía visual Redoer desacopla Scheiren y permite Fusión"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TEAR-R26  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Redoer desacopla Scheiren y permite Fusión</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments: Reinoheart Nivel4 y Scheiren Nivel4 ambos YA en campo; Time Thief Redoer Rango4 en Extra.</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Para Fusion adicional, por ejemplo Havnis Aqua OSCURIDAD de nombre distinto debe encontrarse en GY, y</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Garura en Extra.</text><path d="M 537 261 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. A partir de DOS Nivel4 reales (Reinoheart y Scheiren ya invocados), superpón para Time Thief Redoer</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Rango4, dejando Scheiren como material MONSTRUO debajo.</text><path d="M 537 405 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En una ventana donde Redoer tenga su Efecto Rápido disponible, actívalo; durante RESOLUCIÓN desacopla</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scheiren como material de tipo monstruo (no se descarta como coste al activar).</text><path d="M 537 549 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Por desacoplar MONSTRUO, aplica efecto de Redoer: desterrarse temporalmente hasta la End Phase. Si</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">había material Mágica o Trampa, podrían existir otras opciones pero aquí no se presuponen.</text><path d="M 537 693 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Scheiren llegó al GY por efecto de carta; tras terminar cadena puede activar su disparador para</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fusionar usando ella misma y otros materiales existentes de mano/campo/GY, devolviéndolos al fondo del</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck.</text><path d="M 537 860 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  FUSIÓN</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Solo COMO EJEMPLO CONDICIONAL, si Havnis Aqua OSCURIDAD está en GY y Garura está en Extra,</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scheiren+Havnis (mismo Tipo y Atributo, nombres distintos) permiten Fusionar Garura.</text><path d="M 537 1004 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si no hay otros materiales para ninguna Fusión del Extra, Scheiren fue al GY pero no se puede prometer</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">la Fusión. Reinoheart es GUERRERO, no Aqua, no completa Kaleido-Heart por sí solo.</text><path d="M 537 1148 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1168 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1182" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1211" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con dos Nivel4, Redoer desacopla Scheiren por efecto; puede disparar su Fusión si existe un destino real</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como Garura con Havnis presente.</text><rect x="45" y="1312" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1341" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Scheiren se envió por COSTE de otro efecto no dispara del mismo modo; si se desacopla otro material no</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">sirve; si no queda segundo Aqua OSCURIDAD para Garura, no existe esa Fusión.</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
