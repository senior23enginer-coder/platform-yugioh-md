<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual TR05 | Grito Tiagrimientos + Invocación -&gt; envío tres"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR05  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR05 | Grito Tiagrimientos + Invocación -&gt; envío tres</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments Scream (Mágica Continua) boca arriba en campo; controlas un monstruo Tearlaments real, por</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ejemplo Reinoheart; un monstruo cualquiera es Invocado Normal o Especialmente fuera del Damage Step;</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scream no usó su efecto de envío este turno.</text><path d="M 537 261 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Verifica que Scream ya esté boca arriba y controles Tearlaments o Visas Starfrost al ocurrir una</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocación Normal/Especial. El monstruo Invocado puede ser de cualquier jugador.</text><path d="M 537 405 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En ventana de disparador después de la Invocación, activa efecto de Scream: al resolver manda las TRES</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cartas superiores de TU Deck al GY y aplica -500 ATK a todos los monstruos rivales por el RESTO del turno.</text><path d="M 537 549 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. No elijas tres cartas concretas del Deck; son las superiores desconocidas y pueden incluir Mágicas,</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Trampas o Monstruos.</text><path d="M 537 693 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si se mandó Scheiren u otra Tear con efecto de Fusión por efecto y se cumplen sus condiciones, prepara</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cadena NUEVA tras resolver Scream; no Fusionas antes de terminar la cadena actual.</text><path d="M 537 837 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  BÚSQUEDA</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Scream tiene otro disparador distinto si es enviada AL GY POR EFECTO: puedes buscar 1 Trampa Tear de</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck. El efecto de envío de sus propias tres cartas NO mueve Scream al GY.</text><path d="M 537 981 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Cada efecto de Scream solo se usa una vez por turno; no repitas mill3 por cada monstruo Invocado en el</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mismo turno.</text><path d="M 537 1125 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con Scream activa y Tear propio, una Invocación permite 3 envíos ciegos al GY y disminución de 500 ATK</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rival. Fusiones dependen de lo que realmente salió.</text><rect x="45" y="1289" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scream boca abajo o ausente, sin Tear/Visas controlado al momento exigido, Damage Step o primer efecto ya</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">usado cortan la ruta; sin carta Fusion elegible no prometer una.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
