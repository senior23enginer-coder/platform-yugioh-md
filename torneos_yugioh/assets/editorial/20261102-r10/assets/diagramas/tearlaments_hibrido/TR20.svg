<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual TR20 | Fenrir -&gt; Tear Kash -&gt; enviar tres"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR20  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR20 | Fenrir -&gt; Tear Kash -&gt; enviar tres</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: Kashtira Fenrir en mano y campo propio sin monstruos; Tearlaments Kashtira en Deck, y</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">otra carta Kashtira/Tearlaments en mano o GY para desterrar tras Invocar Tear Kashtira. Main Phase.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Fenrir desde mano porque no controlas monstruos; procedimiento sin cadena si se</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cumplen condiciones.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En tu Main Phase, activa efecto de Fenrir y añade Tearlaments Kashtira del Deck a tu mano; buscar NO la</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En Main Phase, con carta Tear/Kashtira disponible en tu mano o GY para DESTERRAR después, activa el</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Efecto Rápido de Tearlaments Kashtira en mano.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Al resolver, invoca Tearlaments Kashtira a campo; si lo logras, DESTIERRA una carta Tear/Kash de mano o</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">GY. Fenrir en CAMPO no puede ser el recurso desterrado por ese texto.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Tras finalizar esa cadena, el disparador por Invocación de Tear Kashtira permite enviar las 3 cartas</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">superiores de TU Deck o del Deck rival al GY. Ningún nombre específico está garantizado.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si caen Tearlaments con disparador de Fusión por efecto, abre una cadena nueva solo con monstruos y</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales legales; no presupongas Kitkallos (ausente del Extra de este deck).</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fenrir busca Tearlaments Kashtira. Su Invocación y envío de tres cartas son condicionales a otro recurso</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tear/Kash en mano/GY; no se destierra Fenrir de campo.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con solo Fenrir y SIN otra carta Tear/Kash mano/GY, esta ruta TERMINA con Tear Kash en mano. Si niegan</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fenrir no hay búsqueda; si niegan Tear Kash no hay efecto de Invocación posterior.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
