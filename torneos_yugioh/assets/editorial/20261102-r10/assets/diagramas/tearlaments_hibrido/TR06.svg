<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual TR06 | Bienes -&gt; Trivikarma -&gt; acceso a Campo"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR06  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR06 | Bienes -&gt; Trivikarma -&gt; acceso a Campo</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments: Foolish Burial Goods en mano, Trivikarma en Deck, al menos una copia Primeval Planet</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Perlereino en Deck. Main Phase; ninguna activación de Goods ni efecto de Trivikarma este turno.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa Foolish Burial Goods, Mágica Normal, para enviar EXACTAMENTE una carta Mágica/Trampa desde tu</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck al GY como su EFECTO: elige la Trampa Trivikarma.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  CEMENTERIO</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En nueva cadena legal desde el Cementerio, activa el segundo efecto de Trivikarma DESTERRANDO la propia</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Trivikarma como parte de la activación.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Al resolver, añade 1 Mágica/Trampa de tu Deck que MENCIONE «Visas Starfrost», distinta de Trivikarma:</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Primeval Planet Perlereino sí menciona Visas Starfrost y figura en esta lista.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Perlereino pasó a MANO, no automáticamente a Zona de Campo. En Main Phase libre activa el Campo; si</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">resuelve su efecto de activación puede añadir un monstruo Tearlaments disponible de Deck a mano.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. La Trivikarma colocada como Trampa normal requeriría Visas Starfrost en Zona de Monstruos y un objetivo</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rival válido. Este Deck no contiene Visas Starfrost en Main; por eso aquí se aprovecha SOLO su efecto</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desde GY.</text><path d="M 537 981 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. No prometer que los campos de Perlereino que haya en mano aparecen simultáneamente ni una Fusión por el</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mero envío de una Trampa.</text><path d="M 537 1125 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Goods→Trivikarma GY→Perlereino a mano→activar Campo; acceso adicional Tear solo si el efecto del Campo</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">resuelve con objetivo.</text><rect x="45" y="1289" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si no queda Trivikarma o Perlereino en Deck, si no se permite enviar a GY o si hay reemplazo al destierro,</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">la cadena se interrumpe; las cartas no se Invocan por el efecto de Goods.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
