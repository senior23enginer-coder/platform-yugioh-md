<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual TR19 | Sprind Spright envía la única Merrli, sin autoconsumo"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR19  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR19 | Sprind Spright envía la única Merrli, sin autoconsumo</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: I:P Masquerena Link2 YA en campo y otro monstruo disponible; Spright Sprind Link2</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">está en Extra, Merrli (única copia Nivel2) todavía en Deck. Ninguna restricción de Link incompatible.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Verifica requisito impreso de Spright Sprind: DOS monstruos, incluyendo por lo menos uno de Nivel2,</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Rango2 o Link2; I:P Masquerena Link2 cumple.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Usa I:P como UN material que cuenta 1 para el Link Rating y otro monstruo como el segundo material;</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca Spright Sprind Link2 desde Extra en zona legal.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Como Sprind fue Link Summoned, activa su disparador si Merrli Nivel2 sigue físicamente en Deck; envía</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">la ÚNICA Merrli del Deck al GY POR EFECTO.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. En nueva cadena, Merrli enviada por efecto puede intentar Fusionar usando ella misma del GY con otros</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales legales de mano/campo/GY; no promete una Fusión automática ni Kitkallos ausente del Extra.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  ACTIVACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Sprind no puede usarse como material LINK durante el mismo turno en que fue Link Summoned. Tampoco</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">puedes activar sus dos efectos principales ese turno: «solo uno de los siguientes».</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si utilizaste Merrli Nivel2 como material para hacer Sprind, esa copia ya NO permanece en Deck para</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">enviarla: se exige I:P u otro Nivel/Rank/Link2 alternativo.</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">I:P Link2 + otro monstruo→Spright Sprind Link2→Merrli única desde Deck al GY; Fusión únicamente si otros</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales presentes.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con solo Merrli Nivel2 como material inicial, el Deck no tiene una segunda Merrli. Con I:P sola Sprind no</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">puede hacerse: requiere DOS monstruos. Sin I:P en campo, comprobar otra fuente real Level/Rank/Link2.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
