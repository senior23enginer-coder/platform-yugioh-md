<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual Tracto fusiona por descarte de Scheiren"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TEAR-R25  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Tracto fusiona por descarte de Scheiren</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: Fiendsmith’s Tract en mano, Scheiren en mano y Fabled Lurrie en Deck; opcional Havnis</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Aqua OSCURIDAD en GY y Garura en Extra si se quiere Fusion.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  BÚSQUEDA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa Fiendsmith’s Tract como Mágica Normal; al resolver busca un Demonio LUZ de Deck, por ejemplo</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fabled Lurrie, y DESPUÉS descarta una carta de mano por efecto.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  FUSIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Rama A: elige descartar Scheiren que ya estaba en mano. Como Scheiren llegó al GY POR EFECTO de Tract</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(no coste), en nueva cadena puede activar su disparador de Fusión SI hay monstruos materiales suficientes.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En la rama A, Lurrie permanece en mano (no se autoInvoca) y Scheiren puede fusionar Garura solo si hay</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">otro Aqua OSCURIDAD de nombre distinto —por ejemplo Havnis— en mano/campo/GY.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Rama B EXCLUYENTE: descarta el Lurrie que acabas de buscar. Lurrie fue descartado al GY y se puede</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocar Especialmente, pero Scheiren sigue en mano y no dispara su Fusión.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Solo una carta se descarta por Tract al resolver: no obtengas a la vez Fusión de Scheiren y</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">autoInvocación de Lurrie con un solo descarte.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. El otro efecto de Tract desde GY, que permite Fusionar «Fiendsmith» con materiales MANO/CAMPO, es</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">separado y necesita los materiales completos; no es parte automática de la primera resolución.</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tract busca un LIGHT Fiend y descarta UNA carta por efecto. La bifurcación Scheiren Fusion condicional /</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Lurrie Special no se puede confundir.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Scheiren fue descartada pero sin segundo material legal, no genera Fusion; si descartas Lurrie no se</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">envió Scheiren. Si se niega Tract no hay búsqueda ni descarte por ese efecto.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
