<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual TR11 | Grabador -&gt; Tracto -&gt; Lurrie -&gt; Réquiem"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR11  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR11 | Grabador -&gt; Tracto -&gt; Lurrie -&gt; Réquiem</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: Fiendsmith Engraver en mano, Fiendsmith’s Tract y Fabled Lurrie en Deck; Fiendsmith’s</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Requiem Extra; Lacrima the Crimson Tears en Deck. Sin restricciones incompatibles.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Descarta Fiendsmith Engraver de MANO como COSTE de su propio efecto; al resolver añade Fiendsmith’s</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tract del Deck a mano.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Tract (Mágica Normal): añade desde Deck un Demonio LUZ, por ejemplo Fabled Lurrie; DESPUÉS</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">descarta una carta de mano, en esta rama elige la propia Lurrie.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Lurrie fue descartado al GY y su disparador puede Invocarlo Especialmente desde GY. Si eliges descartar</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">otra carta, Lurrie permanecerá en mano, no en campo.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Usa Lurrie (Demonio LUZ) como material Link para Fiendsmith’s Requiem Link1 desde tu Extra.</text><path d="M 537 791 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Durante Main Phase, activa Efecto Rápido de Requiem y SACRIFÍCALO COMO COSTE para Invocar desde Deck</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Lacrima the Crimson Tears (Fiendsmith) si todavía se encuentra allí.</text><path d="M 537 935 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si Lacrima the Crimson Tears fue Invocada, puede enviar una carta Fiendsmith distinta de sí misma desde</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck al GY por efecto; por ejemplo otra copia Engraver real disponible. La extensión depende del ejemplar</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">restante.</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Engraver descartado→Tract→Lurrie descartado/Invocado→Requiem Link1→Lacrima Crimson Tears campo, con envío</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fiendsmith opcional.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Tract está fuera del Deck, Engraver solo se descartó. Si Lurrie no se descarta no se Invoca. Si Requiem</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">falta, no Link. Si Lacrima ya está fuera del Deck, Requiem no la puede traer de allí.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
