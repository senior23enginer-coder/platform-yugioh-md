<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual Horus/Vampiro: cuándo no moler al rival"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TEAR-R27  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Horus/Vampiro: cuándo no moler al rival</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido enfrenta oponente dependiente de Cementerio; Imsety+Sarcófago+Hapi pueden establecer</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Zombie Vampire Rango8, pero no es obligatorio activar su envío simétrico.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  FUSIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Antes de usar Imsety en mano, considera qué enviarás como COSTE para buscar Sarcófago: si envías</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scheiren, Havnis o Merrli como la segunda carta, NO disparan Fusión por haber llegado al GY como COSTE.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  BÚSQUEDA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si usas Imsety + Hapi como coste, buscas Sarcófago; luego puedes activar el Sarcófago y revivir ambos</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Horus Nivel8 del GY para llegar a Zombie Vampire según TR14.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Zombie Vampire puede desacoplar material como COSTE; después envía obligatoriamente cuatro de TU Deck y</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cuatro del RIVAL si su efecto resuelve; la invocación de un monstruo recién enviado es opcional.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  CEMENTERIO</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Evalúa Cementerio adversario antes de activar Zombie. Contra rivales que disparan efectos al ir al GY,</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">enviar cuatro cartas suyas puede ser peor que dejar a Zombie como cuerpo de 3000 ATK.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  ACTIVACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si decides NO activar Zombie, conserva su material y evita enviar cartas del rival; esta es una</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">decisión legítima sin modificar Main ni Extra.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  ACTIVACIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si se activa y resuelve, no elijas qué cuatro caen, ni presupongas que solo tu Deck obtiene beneficio.</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Los disparadores rivales pueden abrir nuevas cadenas después.</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Estrategia de evaluación: los costes Horus no disparan Tear, y Zombie Vampire no tiene obligación de moler</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ambos Decks; se decide según matchup.</text><rect x="45" y="1266" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Imsety puede perder cartas valiosas si envías Tear como COSTE. Si activas Zombie contra rival de</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cementerio, cuatro envíos rivales pueden beneficiarlo. No existe una opción en Zombie para enviar solo tu</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
