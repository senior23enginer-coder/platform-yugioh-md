<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual TR07 | Bienes -&gt; Grito -&gt; buscar Cryme/Metanoise"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR07  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR07 | Bienes -&gt; Grito -&gt; buscar Cryme/Metanoise</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments: Foolish Burial Goods en mano, Tearlaments Scream en Deck, Tearlaments Cryme o Metanoise en</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck, ninguna de sus restricciones usadas. No se asume una Trampa colocada previamente.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa Foolish Burial Goods y envía desde Deck Tearlaments Scream al GY POR EFECTO.</text><path d="M 537 359 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En nueva cadena, como Scream fue enviada por EFECTO, activa su disparador desde GY para añadir 1 Trampa</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments presente en Deck.</text><path d="M 537 503 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Puedes elegir Cryme (respuesta de tipo Contraefecto bajo sus requisitos y coste) o Metanoise</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(interacción con monstruos), pero de esta búsqueda sólo se añade UNA.</text><path d="M 537 647 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  BÚSQUEDA</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. La Trampa buscada entra a MANO; colócala si hay zona libre. En condiciones normales no puedes activarla</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en ese mismo turno de colocación.</text><path d="M 537 791 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  CEMENTERIO</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. No actives ahora el primer efecto de Scream que envía 3 superiores: Scream ya está en el Cementerio, no</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permanece Continua boca arriba en campo.</text><path d="M 537 935 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Para jugar Cryme después, tendrás que controlar una carta Tearlaments boca arriba y enviar 1 monstruo</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de mano al GY según su texto al resolver. Tener la Trampa no garantiza por sí solo anulación.</text><path d="M 537 1079 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Goods convierte la Scream del Deck en una Trampa Tearlaments en mano mediante disparador GY; la defensa se</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">prepara para turno posterior.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Goods es negada o Scream no alcanza GY por efecto, no busca; si no queda Trampa Tear en Deck, no suma</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">carta; no activar trampas recién colocadas sin permiso.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
