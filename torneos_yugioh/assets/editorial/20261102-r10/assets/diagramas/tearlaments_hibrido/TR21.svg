<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual TR21 | I:P Enmascarada + otro cuerpo -&gt; S:P rival"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR21  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR21 | I:P Enmascarada + otro cuerpo -&gt; S:P rival</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: I:P Masquerena Link2 previamente controlada boca arriba y OTRO monstruo de efecto</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">apto en campo; turno del RIVAL, Main Phase; S:P Little Knight Link2 en Extra.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. I:P requiere DOS monstruos NO Link para haber sido Link Summoned previamente; no se Invoca ella misma</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">con un cuerpo único.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Durante la Main Phase del adversario, en ventana de Efectos Rápidos, activa el efecto de I:P para</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocar Link inmediatamente después de resolver; no funciona en Battle Phase.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Usa I:P Link2 contada como 1 material y otro monstruo de EFECTO como 1 material para S:P Little Knight</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Link2, que exige exactamente DOS monstruos de efecto.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Como usaste un monstruo Link (I:P) para esa Invocación Link, S:P puede activar, en nueva cadena, su</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">disparador: selecciona 1 carta del campo o de cualquier GY y destiérrala.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. I:P confiere a la S:P que la utilizó como material protección frente a destrucción por efectos rivales;</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">NO protege contra desterrar, devolver ni negar.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  DESTIERRO</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. S:P tiene otro efecto rápido separado: cuando rival activa carta/efecto, selecciona 2 monstruos boca</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">arriba en campo incluyendo uno tuyo y destierra ambos hasta End Phase. Son DOS objetivos, no solo el</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">enemigo.</text><path d="M 537 1125 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">I:P + segundo monstruo efecto→S:P en Main Phase rival, con destierro de una carta al ser Link Summoned y</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">protección contra destrucción de efectos rivales.</text><rect x="45" y="1289" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin segundo monstruo de efecto la Link no es legal; sin una carta seleccionable no se activa el destierro</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">al entrar; fuera de Main Phase rival I:P no tiene esa ventana.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
