<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 939" role="img" aria-label="Guía visual TR13 | Tracto: descarte Tear por EFECTO"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR13  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR13 | Tracto: descarte Tear por EFECTO</text><rect x="45" y="126" width="984" height="86" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tracto en mano, otro LIGHT Fiend buscable, Havnis/Merrli/Scheiren en mano.</text><path d="M 537 215 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 234 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="247" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="276" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="306" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tracto añade Demonio LUZ.</text><path d="M 537 336 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 355 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="368" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="397" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="427" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Luego DESCARTA el Tear como parte del efecto.</text><path d="M 537 457 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 476 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="489" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="518" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  FUSIÓN</text><text x="74" y="548" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Después de resolución el Tear enviado por efecto puede fusionar usando materiales reales; a diferencia de</text><text x="74" y="571" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Amset/Sarcófago, no es descarte como coste.</text><path d="M 537 601 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 621 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="635" width="984" height="86" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="664" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="694" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tear descartado por Tracto como efecto; posibilidad de activar su Fusión con los demás materiales.</text><rect x="45" y="742" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="771" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="801" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tracto no resuelve o el Tear enviado no tiene efecto fusionador disponible; falta material válido. PRUEBA</text><text x="74" y="824" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DE REGLAS: Scheiren debe estar en mano, no tener su efecto agotado, y debe haber monstruo de Fusión y</text><text x="74" y="847" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales legales incluyendo la propia Scheiren. Tract NO descarta dos cartas.</text><text x="48" y="909" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="932" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
