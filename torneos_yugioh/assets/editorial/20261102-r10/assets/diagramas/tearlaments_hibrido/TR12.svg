<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual TR12 | Grabador revivido -&gt; Secuencia -&gt; Lácrima Fusión"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR12  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR12 | Grabador revivido -&gt; Secuencia -&gt; Lácrima Fusión</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: Fiendsmith Engraver y Fabled Lurrie ya en GY; Lacrima the Crimson Tears (Main, LIGHT</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fiend) YA en campo; Fiendsmith’s Sequence Link2 y Fiendsmith’s Lacrima Fusion en Extra.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. En GY, activa Engraver; devuelve al Deck el OTRO Demonio LUZ en GY, Lurrie, para Invocarse</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Especialmente desde GY. Engraver no puede devolverse a sí mismo.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Ahora con dos monstruos de campo distintos, Engraver LIGHT Fiend y Lacrima Crimson Tears LIGHT Fiend,</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca Link Fiendsmith’s Sequence Link2 usando ambos.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  FUSIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Los dos materiales de Link llegan al GY; durante Main Phase Sequence puede fusionar un monstruo Demonio</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Extra usando materiales desde el CEMENTERIO que devuelve al Deck.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Como tanto Engraver como Lacrima Crimson Tears son Demonios LUZ, devuélvelos al Deck para Invocar por</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fusión Fiendsmith’s Lacrima, que exige DOS LIGHT Fiends.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Fiendsmith’s Lacrima Invocada por Fusión puede seleccionar 1 Demonio LUZ desterrado o en GY y añadirlo</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">a mano o Invocarlo; pero solo si existe un objetivo realmente elegible después del retorno de materiales.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. No afirmes que Engraver revive y entra a Sequence por sí SOLO: se necesitaba segundo cuerpo LIGHT Fiend</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en campo al paso 2.</text><path d="M 537 1102 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si el estado inicial exige Lurrie GY + Lacrima Crimson Tears campo, Engraver revive, Sequence usa dos</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Demonios LUZ y fusiona la Lacrima de Extra con materiales reales GY.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Lurrie u otro Demonio LUZ en GY no revive Engraver. Sin segundo cuerpo de campo no existe Sequence. Si</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">los materiales no llegan GY, Sequence no fusiona.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
