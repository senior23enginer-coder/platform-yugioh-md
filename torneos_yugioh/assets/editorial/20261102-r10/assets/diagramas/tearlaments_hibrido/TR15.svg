<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1509" role="img" aria-label="Guía visual TR15 | Vampiro Zombi: ambos decks envían cuatro"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR15  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR15 | Vampiro Zombi: ambos decks envían cuatro</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: The Zombie Vampire Rango8 YA está Invocado legalmente en campo con al menos 1</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">material; ambos Decks tienen 4 cartas superiores disponibles y el efecto de Vampiro no fue usado este</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno.</text><path d="M 537 261 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Confirma Vampiro Zombi en campo con material; puede provenir de Imsety8 + Hapi8 si ambos se reunieron</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">legalmente con Sarcófago (ruta TR14).</text><path d="M 537 405 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  FUSIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa el efecto de Zombie Vampire y desacopla exactamente 1 material COMO COSTE DE ACTIVACIÓN. Si</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">retiras un monstruo Tearlaments como material por coste, no dispares su Fusión por «enviado por EFECTO».</text><path d="M 537 549 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Si el efecto resuelve, CADA jugador manda las CUATRO cartas superiores de SU Deck al GY por efecto. No</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">eliges sus nombres: ocho cartas sumando ambos Decks.</text><path d="M 537 693 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si alguno de esos envíos incluye cualquier monstruo en cualquier GY, puedes Invocar Especialmente UNO</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de los monstruos enviados por este efecto a TU lado del campo, si cumple sus condiciones propias de</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocación.</text><path d="M 537 860 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  FUSIÓN</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Tearlaments propia que haya sido enviada al GY por el efecto de molido podrá activar su disparador en</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cadena nueva cuando las condiciones de Fusión estén disponibles; no confundir con material desacoplado</text><text x="74" y="997" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como coste.</text><path d="M 537 1027 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1046 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1059" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1088" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  CEMENTERIO</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Es opcional activar el efecto: contra un rival cuyo Cementerio se beneficia mucho, puedes dejar Zombie</text><text x="74" y="1141" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Vampire como cuerpo Rango8 3000 ATK sin moler ambos Decks.</text><path d="M 537 1171 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1191 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1205" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1234" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">El efecto de Zombie Vampire envía 4+4 cartas por efecto y puede Invocar una de las criaturas recién</text><text x="74" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">enviadas; el desacople previo es COSTE y se distingue expresamente.</text><rect x="45" y="1335" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1364" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si niegan Vampiro, su material queda perdido y ningún Deck es molido. Si nada enviado fue monstruo, no hay</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocación adicional. Si el rival explota GY, no es obligatorio activar Vampiro.</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1502" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
