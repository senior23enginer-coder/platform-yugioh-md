<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual TR08 | Bienes -&gt; Metarruido -&gt; recuperar Tear"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR08  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR08 | Bienes -&gt; Metarruido -&gt; recuperar Tear</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments: Foolish Burial Goods en mano, Tearlaments Metanoise en Deck, al menos 1 monstruo Tearlaments</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">válido en GY (por ejemplo Scheiren o Reinoheart); su efecto de Trampa GY aún libre.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  CEMENTERIO</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Comprueba el objetivo de Cementerio ANTES de diseñar la ruta: sin un monstruo Tearlaments allí,</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Metanoise no recupera carta.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Foolish Burial Goods para enviar Metanoise del Deck al GY por su efecto.</text><path d="M 537 503 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En nueva cadena, Metanoise enviada al GY por efecto activa su efecto de recuperación SELECCIONANDO 1</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo Tearlaments en tu GY.</text><path d="M 537 647 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Cuando resuelva, si ese objetivo permanece legal en el GY, añádelo desde GY a la MANO. No se Invoca al</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">campo por esta recuperación.</text><path d="M 537 791 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si el rival retira en cadena al monstruo seleccionado del GY, no llega carta; tampoco puedes</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">seleccionar Metanoise porque ella es Trampa, no monstruo Tear.</text><path d="M 537 935 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  ACTIVACIÓN</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Esta línea usa un efecto de Metanoise por turno: la Trampa no estaba colocada ni activada antes; no</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">atribuirle su otro efecto de poner monstruos en Defensa boca abajo sin estar en campo.</text><path d="M 537 1079 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Goods + Metanoise recupera exactamente un monstruo Tearlaments desde Cementerio a mano, siempre que ya</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">exista el blanco y permanezca.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin blanco Tear en GY al activar, Goods puede enviar Metanoise pero no se recupera monstruo. Si se niega</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Goods, no se activó disparador. Si el blanco se retira al encadenar, falla recuperación.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
