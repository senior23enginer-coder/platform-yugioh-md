<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1273" role="img" aria-label="Guía visual TR02 | Scheiren -&gt; envío desde mano + tres cartas"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR02  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR02 | Scheiren -&gt; envío desde mano + tres cartas</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Tiagrimientos Scheiren + Tiagrimientos Merrli; otra zona principal libre. Extra: Garura. El motor de</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">envío puede mandar tres cartas adicionales no predeterminadas desde Deck.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. En tu Main Phase, activa el efecto de Scheiren desde mano: Invócala Especialmente al campo.</text><path d="M 537 359 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver, ENVÍA Merrli desde mano al GY por EFECTO (no como coste) y después envía las tres cartas</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">superiores del Deck al GY; no inventes cuáles fueron.</text><path d="M 537 503 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  FUSIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Después de concluir la cadena, Merrli fue enviada por efecto fuera del Damage Step: activa su efecto de</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fusión si está libre y la Fusión es legal.</text><path d="M 537 647 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Para Garura, usa Merrli (DARK Aqua, en GY) y Scheiren (DARK Aqua distinta, en campo) como materiales.</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Coloca ambos al fondo del Deck, e Invoca Garura desde Extra.</text><path d="M 537 791 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  ACTIVACIÓN</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si el envío aleatorio de tres cartas activó otros disparadores reales, documenta una cadena de efectos</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">simultáneos acorde a las cartas REVELADAS; no presupongas un molino perfecto.</text><path d="M 537 935 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 955 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="969" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="998" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1028" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Garura, Alas de Vida Resonante, en campo desde Scheiren + Merrli, dos Aqua/DARK de nombre diferente; hasta</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">tres envíos de Deck no se contabilizan como efectos asegurados.</text><rect x="45" y="1099" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1128" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1158" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Scheiren es negada o no envía Merrli por efecto, no surge su disparador. Si Scheiren sale del campo</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">antes de resolver Merrli y no hay otro material DARK Aqua válido, falla la Fusión de Garura.</text><text x="48" y="1243" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
