<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual TR09 | Metarruido colocado: voltear + mandar fusionador"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR09  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR09 | Metarruido colocado: voltear + mandar fusionador</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Metarruido Tiagrimientos (Metanoise) colocada legalmente desde turno anterior; controlas al menos un</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments; rival tiene 1 monstruo boca arriba que puede pasar a Defensa boca abajo; Merrli está en Deck.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. En ventana de activación de Trampa, activa Metanoise y SELECCIONA un monstruo rival BOCA ARRIBA que sea</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">legal voltear boca abajo en Defensa.</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver, primero cambia el objetivo a DEFENSA BOCA ABAJO. Si no fue posible aplicar esa parte, no</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">garantices el envío posterior.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. DESPUÉS, envía desde tu Deck al GY 1 monstruo Tearlaments real (por ejemplo la única Merrli, si todavía</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">está en Deck). Ese envío es EFECTO de Metanoise, no coste.</text><path d="M 537 670 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si Merrli efectivamente fue enviada por efecto fuera de Damage Step y aún no usaste su efecto, en nueva</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cadena puede activar Fusión, siempre que existan materiales legales para la Fusión elegida.</text><path d="M 537 814 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. No afirmes que puedes seleccionar Monstruos Enlace para ponerlos boca abajo ni que el monstruo rival</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">quedó destruido: cambió de posición.</text><path d="M 537 958 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  ACTIVACIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. No confundas Metanoise colocada con activar su efecto desde el GY, que tiene otra condición y objetivo.</text><path d="M 537 1079 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Metanoise puede voltear un monstruo rival en Defensa boca abajo y después enviar una Tearlaments desde</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck por efecto, habilitando fusión condicional.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Tearlaments propio/Visas, sin objetivo que pueda voltearse, con carta negada o con Merrli ya fuera del</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck, la línea debe ajustarse. Fusión solo si materiales disponibles.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
