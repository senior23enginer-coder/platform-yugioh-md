<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual TR18 | Caleido-Heart: Reinoheart + DOS Aqua"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR18  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR18 | Caleido-Heart: Reinoheart + DOS Aqua</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tearlaments híbrido: Reinoheart Guerrero AGUA en campo o GY; Scheiren y Havnis ambos Aqua OSCURIDAD en</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">campo/mano/GY, Scheiren acaba de llegar a GY POR EFECTO para activar su disparador; Kaleido-Heart en</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Extra.</text><path d="M 537 261 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Lee el material impreso de Kaleido-Heart: «Tearlaments Reinoheart» + DOS monstruos Aqua. Reinoheart es</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Guerrero y no cuenta como Aqua adicional.</text><path d="M 537 405 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Verifica exactamente los tres materiales reales: Reinoheart, Scheiren que disparó desde GY y Havnis</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Aqua restante, por ejemplo de GY. No asumas que Tearlaments Kashtira es Aqua: es Psíquico.</text><path d="M 537 549 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  FUSIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Cuando Scheiren fue enviada al GY por efecto, en una cadena NUEVA activa su efecto de Fusión; no puede</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activarlo si llegó como COSTE, y no puede usar otro trigger ya gastado ese turno.</text><path d="M 537 693 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Al resolver, devuelve los TRES materiales correspondientes (Reinoheart + Scheiren + Havnis) al fondo</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Deck en cualquier orden según Tearlaments, desde las zonas admitidas.</text><path d="M 537 837 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Invoca por Fusión Kaleido-Heart desde Extra. Al ser Invocado especialmente, su efecto puede seleccionar</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">una carta rival y barajarla al Deck; no es destrucción.</text><path d="M 537 981 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si falta Havnis u otra Aqua distinta compatible, la ruta queda detenida. No se emplea un segundo</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Reinoheart para fingir que es Aqua.</text><path d="M 537 1125 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Kaleido-Heart puede fusionarse en esta lista solo reuniendo Reinoheart más dos Aqua; esta variante usa</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scheiren y Havnis, ambas en inventario.</text><rect x="45" y="1289" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Reinoheart+Scheiren solos NO son suficientes. Tearlaments Kashtira tampoco completa Aqua. Con Scheiren</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">enviada por coste no se activa su efecto de Fusión.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
