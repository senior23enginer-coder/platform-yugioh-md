<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual TR03 | Havnis en turno contrario -&gt; envío tres"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#30544d" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#82c1ae"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">TEARLAMENTS HÍBRIDO  ·  TR03  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">TR03 | Havnis en turno contrario -&gt; envío tres</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Turno rival, fuera o dentro de Main según la ventana: Tiagrimientos Havnis en tu mano; rival activa efecto</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de MONSTRUO EN EL CAMPO; hay 3 cartas en la parte superior de tu Deck.</text><path d="M 537 238 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Cuando el adversario ACTIVA un efecto de monstruo EN EL CAMPO, puedes responder en una cadena válida</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activando el Efecto Rápido de Havnis desde mano (por ejemplo CL2 frente al CL1 rival).</text><path d="M 537 382 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver Havnis, Invócala Especialmente desde mano; SI logra Invocarse, envía las tres cartas</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">superiores de tu Deck al GY. No elijas qué cartas caen.</text><path d="M 537 526 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  FUSIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Cuando termine de resolverse la cadena completa, verifica exactamente las cartas enviadas; si alguna</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tears con efecto al ser enviada por EFECTO se activó legalmente, construye cadena nueva, no fusionas</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">automáticamente.</text><path d="M 537 693 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Havnis permanece en el campo; ella NO se envió al GY por usar su primer efecto, por lo que su propio</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efecto de Fusión EN GY no se dispara por esta sola línea.</text><path d="M 537 837 v 29" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  CEMENTERIO</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si el oponente solo activó un efecto de monstruo desde MANO o CEMENTERIO, no se satisface esta</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">condición específica de Havnis.</text><path d="M 537 981 v 30" stroke="#82c1ae" stroke-width="4" fill="none"/><path d="M 528 1001 l 9 10 l 9 -10" stroke="#82c1ae" stroke-width="4" fill="none"/><rect x="45" y="1015" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1044" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Havnis invocada en el turno del rival y tres cartas desconocidas enviadas desde Deck a GY por efecto, con</text><text x="74" y="1097" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">posibles disparadores solo si el molino real los contiene.</text><rect x="45" y="1145" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1174" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Efecto rival de mano/GY en lugar de campo; Havnis negada/no invocada; Deck incapaz de enviar 3; enviadas</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">sin efecto de Fusión; restricciones de cadena/Damage Step. Nunca afirmar una Fusión garantizada.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
