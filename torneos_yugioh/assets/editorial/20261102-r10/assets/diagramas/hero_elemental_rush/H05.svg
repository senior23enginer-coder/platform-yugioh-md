<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" role="img" aria-label="HERO Elemental Rush · H05"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2134"/><stop offset="1" stop-color="#0a1122"/></linearGradient></defs><rect x="0" y="0" width="940" height="508" fill="url(#bg)" rx="18"/><text x="24" y="38" font-size="23" font-weight="800" fill="#f8df8c">HERO Elemental Rush · H05</text><text x="24" y="70" font-size="15" fill="#7cdded">CONDICIONAL · Guía documental; no certifica legalidad</text><rect x="27" y="108" width="885" height="96" fill="#122f48" stroke="#e5bd55" rx="12"/><circle cx="69" cy="156" r="23" fill="#087a98"/><text x="69" y="163" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">1</text><text x="110" y="135" fill="#e9f9ff" font-size="17">Comprobar si existe un objetivo boca arriba cuando se desee usar la Skill.</text><path d="M470 207 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="228" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="276" r="23" fill="#087a98"/><text x="69" y="283" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">2</text><text x="110" y="255" fill="#e9f9ff" font-size="17">Verificar que la carta enviada del Campo no perjudica la posición defensiva.</text><path d="M470 327 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="348" width="885" height="96" fill="#122f48" stroke="#e5bd55" rx="12"/><circle cx="69" cy="396" r="23" fill="#087a98"/><text x="69" y="403" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">3</text><text x="110" y="375" fill="#e9f9ff" font-size="17">Si no existe objetivo útil o el intercambio es desfavorable, mantener la Skill sin</text><text x="110" y="398" fill="#e9f9ff" font-size="17">usar.</text></svg>