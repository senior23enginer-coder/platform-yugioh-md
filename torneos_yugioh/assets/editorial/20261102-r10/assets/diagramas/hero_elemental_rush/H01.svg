<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 748" role="img" aria-label="HERO Elemental Rush · H01"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2134"/><stop offset="1" stop-color="#0a1122"/></linearGradient></defs><rect x="0" y="0" width="940" height="748" fill="url(#bg)" rx="18"/><text x="24" y="38" font-size="23" font-weight="800" fill="#f8df8c">HERO Elemental Rush · H01</text><text x="24" y="70" font-size="15" fill="#7cdded">CONDICIONAL · Guía documental; no certifica legalidad</text><rect x="27" y="108" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="156" r="23" fill="#087a98"/><text x="69" y="163" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">1</text><text x="110" y="135" fill="#e9f9ff" font-size="17">Confirmar predicado del Main (Guerrero/LUZ de ATK &gt;=1600) y Extra (Guerrero).</text><path d="M470 207 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="228" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="276" r="23" fill="#087a98"/><text x="69" y="283" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">2</text><text x="110" y="255" fill="#e9f9ff" font-size="17">Disponer de 1 carta controlada y de 1 monstruo boca arriba en el Campo.</text><path d="M470 327 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="348" width="885" height="96" fill="#122f48" stroke="#e5bd55" rx="12"/><circle cx="69" cy="396" r="23" fill="#087a98"/><text x="69" y="403" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">3</text><text x="110" y="375" fill="#e9f9ff" font-size="17">Activar la Skill y mandar 1 carta propia del Campo al Cementerio, según REQUISITO.</text><path d="M470 447 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="468" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="516" r="23" fill="#087a98"/><text x="69" y="523" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">4</text><text x="110" y="495" fill="#e9f9ff" font-size="17">Aplicar -600 ATK/DEF a un monstruo boca arriba hasta el final del turno.</text><path d="M470 567 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="588" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="636" r="23" fill="#087a98"/><text x="69" y="643" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">5</text><text x="110" y="615" fill="#e9f9ff" font-size="17">Si se desea, añadir una «Fusión» de las 2 registradas desde Deck/Cementerio, siempre</text><text x="110" y="638" fill="#e9f9ff" font-size="17">que una copie esté realmente allí.</text></svg>