<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1555" role="img" aria-label="Guía visual H-C | CYBERDARK CLAW / REALM -&gt; CHIMERA -&gt; POWER BOND"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  H-C  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">H-C | CYBERDARK CLAW / REALM -&gt; CHIMERA -&gt; POWER BOND</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cyber Dragon Pure; Cyberdark Claw en mano, Cyberdark Realm (2) y Cyberdark Chimera (1) todavía en Deck,</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Power Bond (1) en Deck; no se gastaron los efectos respectivos, espacio de M/T, y al menos 1 Mágica/Trampa</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">descartable si se desea el Bond.</text><path d="M 537 261 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  BÚSQUEDA</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Descarta Cyberdark Claw desde MANO para activar su efecto de buscar una Mágica/Trampa «Cyberdark»;</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">añade Cyberdark Realm del Deck a mano.</text><path d="M 537 405 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Realm desde mano en zona de Mágicas/Trampas. Su efecto de activación, si resuelve, añade</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cyberdark Chimera del Deck a mano, siempre que ese nombre no esté ya en tu GY.</text><path d="M 537 549 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En Main Phase, activa el efecto separado de Realm para realizar inmediatamente después de resolver una</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocación Normal de un monstruo «Cyberdark»; elige Chimera desde mano. Es una Normal adicional</text><text x="74" y="686" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">proporcionada por Realm, no una Invocación Especial.</text><path d="M 537 716 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 735 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="748" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="777" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Con Chimera boca arriba, activa su efecto y DESCARTA una carta Mágica/Trampa real de mano. Añade Power</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Bond del Deck a mano.</text><path d="M 537 860 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Aplican a todo ese turno las restricciones de Chimera sobre materiales: solo monstruos Dragón o Máquina</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">«Cyber» cuando hagas Invocación por Fusión; la excepción de usar monstruos del GY desterrándolos se aplica</text><text x="74" y="997" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">UNA vez a una Fusión de este turno.</text><path d="M 537 1027 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1046 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1059" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1088" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Power Bond está ahora en MANO, no activado: para una Fusión concreta comprueba 2+ materiales conforme</text><text x="74" y="1141" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">al monstruo de Fusión realmente registrado y su texto. No prometas Cyber Eternity u otro Extra sin sus</text><text x="74" y="1164" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales.</text><path d="M 537 1194 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1214 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1228" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1257" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Claw→Realm→Chimera→Power Bond en mano, consumiendo Claw y una Mágica/Trampa adicional; Chimera en campo.</text><text x="74" y="1310" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">La Fusión es una extensión opcional CON materiales válidos.</text><rect x="45" y="1358" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1387" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Chimera está fuera del Deck o su nombre está en GY, Realm puede no buscarla. Si Bond ya está fuera del</text><text x="74" y="1440" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck, Chimera no añade nada. Si no hay M/T descartable no se activa Chimera. Realm no da una Fusión</text><text x="74" y="1463" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">gratis.</text><text x="48" y="1525" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1548" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
