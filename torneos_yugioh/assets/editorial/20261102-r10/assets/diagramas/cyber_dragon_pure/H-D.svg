<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual H-D | NACHSTER + MÁQUINA EN CEMENTERIO"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  H-D  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">H-D | NACHSTER + MÁQUINA EN CEMENTERIO</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Cyber Dragon Nachster Nivel1 y el Cyber Dragon original (Máquina 2100 ATK). Dos zonas libres y ambos</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efectos de Nachster sin usar.</text><path d="M 537 238 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa el primer efecto de Nachster en mano: DESCARTA Cyber Dragon original como COSTE antes de</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cualquier respuesta.</text><path d="M 537 382 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si el efecto resuelve, Invoca Especialmente Nachster Nivel1 desde mano al campo. El Cyber Dragon</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">descartado ya está en tu GY.</text><path d="M 537 526 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Nachster, por haber sido Invocado, activa su segundo efecto y SELECCIONA el Cyber Dragon en GY: es</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Máquina con 2100 ATK y cumple exactamente el requisito.</text><path d="M 537 670 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Al resolver, Invoca Especialmente Cyber Dragon original del GY al campo. Desde la resolución del</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">segundo efecto, solo puedes Invocar Especialmente monstruos MÁQUINA el resto del turno.</text><path d="M 537 814 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Resultado: Nachster sigue NIVEL1 y Cyber Dragon es NIVEL5. NO puedes hacer automáticamente Cyber Dragon</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nova con ambos: Nova requiere DOS Máquinas NIVEL5.</text><path d="M 537 958 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Un Cyber Dragon descartado como coste regresa legalmente al campo por efecto posterior de Nachster; quedan</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2 Máquinas con niveles 1 y 5, NO dos Nivel5.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Nachster es negado antes de Invocarse, Cyber Dragon ya fue descartado por coste; si Nachster llega pero</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">el objetivo 2100 sale del GY en cadena, no reaparece; si se agotó un efecto de Nachster este turno, no</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">repetirlo.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
