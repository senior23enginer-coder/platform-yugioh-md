<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual H-F | FUSIÓN DE ATAQUE"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  H-F  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">H-F | FUSIÓN DE ATAQUE</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cyber Dragon Pure: Cyberload Fusion en mano; Cyber Eternity Dragon en Extra; desde campo propio y/o</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destierro BOCA ARRIBA existen TRES materiales: 1 monstruo «Cyber Dragon» y dos Máquinas adicionales con</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">compatibilidad completa.</text><path d="M 537 261 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  FUSIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Identifica la Fusión de tu Extra por su nombre confirmado: Cyber Eternity Dragon exige UN monstruo</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">«Cyber Dragon» + DOS monstruos Máquina (tres cuerpos distintos).</text><path d="M 537 405 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  FUSIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Confirma que los tres materiales estén EN TU CAMPO o DESTERRADOS BOCA ARRIBA: Cyberload Fusion no toma</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales desde la mano ni del Cementerio.</text><path d="M 537 549 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  FUSIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa Cyberload Fusion en ventana legal, como Mágica Rápida, para barajar al Deck los tres materiales</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">apropiados de estas zonas; no los destierres.</text><path d="M 537 693 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si resuelve, Invoca por Fusión Cyber Eternity Dragon del Extra y, para el resto de ese turno, tus otros</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruos no pueden atacar; sí puede atacar el monstruo Invocado por esa Fusión.</text><path d="M 537 837 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  FUSIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. El efecto protector de Eternity solo opera si en tu GY ya hay al menos un monstruo de Fusión Máquina;</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no inventar inmunidad permanente sin ese requisito.</text><path d="M 537 981 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si Cyberdark Chimera se activó antes en el turno, solo se pueden usar monstruos «Cyber» Máquina/Dragón</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como materiales de Fusión; aunque Eternity admita dos Máquinas genéricas, Chimera restringe la selección.</text><path d="M 537 1125 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cyberload Fusion puede invocar Cyber Eternity Dragon usando tres materiales propios de campo/destierro</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">boca arriba; controla restricciones de ataque, protección y Chimera.</text><rect x="45" y="1289" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con dos cuerpos no basta; tampoco con tres solo en Cementerio. Si el Extra físicamente no tiene otro</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo Fusion confirmado no propongas objetivos alternativos no identificados.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
