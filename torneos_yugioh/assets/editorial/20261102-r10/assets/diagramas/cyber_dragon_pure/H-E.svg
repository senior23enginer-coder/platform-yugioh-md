<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1296" role="img" aria-label="Guía visual H-E | NOVA -&gt; INFINITY"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  H-E  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">H-E | NOVA -&gt; INFINITY</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Estado previo real: 2 monstruos Máquina Nivel5 boca arriba en campo, todavía no gastados; Extra: Cyber</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dragon Nova + Cyber Dragon Infinity.</text><path d="M 537 238 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Comprueba DOS Máquinas de Nivel5 ACTUAL, no solo cartas con nombre Cyber Dragon de nivel bajo. Se</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">requieren ambos materiales antes de empezar.</text><path d="M 537 382 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Usa ambas Máquinas Nivel5 para Invocar Xyz Cyber Dragon Nova Rango5 con exactamente dos materiales.</text><path d="M 537 503 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En una oportunidad de Invocación Xyz legal, usa Nova que controlas como material para Invocar Cyber</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dragon Infinity del Extra; transfiere también los dos materiales que estaban bajo Nova.</text><path d="M 537 647 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Resultado: Infinity tiene TRES materiales (Nova + los dos anteriores). Su ATK es su base 2100 + 200 × 3</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">= 2700, mientras conserve esos tres materiales y sin otros modificadores.</text><path d="M 537 791 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Su negación rápida una vez por turno requiere SEPARAR 1 material como coste; si se separa, su</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">bonificación de ATK baja 200. Puede acoplar un monstruo boca arriba en Ataque si su efecto correspondiente</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">está disponible.</text><path d="M 537 958 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cyber Dragon Infinity con 3 materiales y 2700 ATK sin otros modificadores, a partir de DOS Máquinas Nivel5</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">reales; no se asume que Core Nivel2 cumpla ese requisito.</text><rect x="45" y="1122" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin dos Máquinas Nivel5, Nova no puede invocarse así. Si Nova fue negado y retirado, no hay Infinity sobre</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">él. No contar el ATK de 2700 tras separar materiales; se recalcula según materiales reales.</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
