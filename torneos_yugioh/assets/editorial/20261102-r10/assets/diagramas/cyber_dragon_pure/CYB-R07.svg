<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual Core + Clockwork + Fortress contra monstruos visibles"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  CYB-R07  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Core + Clockwork + Fortress contra monstruos visibles</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck Cyber propio: Core en mano, Clockwork Night en mano, Fortress en Extra; rival con 1 monstruo FACE-UP</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no inmune a Mágicas ni prohibido de enviarse al GY.</text><path d="M 537 238 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normal Cyber Dragon Core; su nombre en campo pasa a Cyber Dragon, sin aumentar su Nivel2.</text><path d="M 537 359 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Clockwork Night. Convierte TODOS los monstruos boca arriba del campo en Máquina. Verifica que el</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo rival realmente resulte afectado por la Mágica.</text><path d="M 537 503 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Invoca especialmente Chimeratech Fortress Dragon desde Extra mediante su PROCEDIMIENTO: envía tu Core</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(nombre Cyber Dragon) + la Máquina rival al GY; no se activa una carta Polymerization.</text><path d="M 537 647 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Con dos materiales, Fortress posee 2000 ATK original. Mientras Clockwork Night siga boca arriba, gana</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">500 como Máquina propia (ATK actual 2500).</text><path d="M 537 791 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si el rival tiene más Máquinas válidas y decides enviar 3 en total, el ATK original será 3000; cuenta</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">solo materiales realmente usados y sus resistencias.</text><path d="M 537 935 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si el rival retira Clockwork Night o su monstruo cambia de estado/tipo antes del procedimiento, no hay</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">material enemigo garantizado. No todos los monstruos pueden usarse simplemente por estar boca arriba.</text><path d="M 537 1079 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">La eliminación por contacto de Fortress funciona sobre un monstruo rival convertido en Máquina, siempre</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">que sea material legal enviable; cálculo ATK por cantidad real.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Core no está disponible o su nombre negado; Night es negada/retirada; enemigo boca abajo, inmune o no se</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">puede enviar al GY; falta Fortress en Extra.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
