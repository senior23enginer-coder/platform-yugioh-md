<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1296" role="img" aria-label="Guía visual H-A | CORE -&gt; CYBER EMERGENCY/REVSYSTEM"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  H-A  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">H-A | CORE -&gt; CYBER EMERGENCY/REVSYSTEM</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Cyber Dragon Core; Normal libre. Deck: Cyber Emergency y un monstruo Cyber Dragon buscable. Se</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">estudia la búsqueda real; no se supone otro cuerpo libre.</text><path d="M 537 238 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente Cyber Dragon Core (Máquina LIGHT Nivel2).</text><path d="M 537 359 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa su efecto disparado por Invocación Normal: añade Cyber Emergency desde Deck a mano como Mágica</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">&#x27;Cyber&#x27;.</text><path d="M 537 503 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En una nueva cadena, activa Cyber Emergency: añade 1 monstruo Cyber Dragon apropiado desde Deck a mano;</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">es una BÚSQUEDA, no una Invocación.</text><path d="M 537 647 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Mantén Core en campo (su nombre ahí es Cyber Dragon). No declares Cyber Dragon Nova: Core sigue siendo</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel2 y no existen dos Nivel5 por esta línea.</text><path d="M 537 791 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Variante independiente: si buscas Cyber Revsystem en lugar de Emergency, solo permite Invocar un &#x27;Cyber</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dragon&#x27; desde mano o GY que realmente exista allí; el propio Core todavía está en campo.</text><path d="M 537 935 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 955 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="969" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="998" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1028" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Core Nivel2 en campo y un Cyber Dragon buscado a mano tras resolver Emergency; Invocación Normal gastada.</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Se obtiene acceso, no Nova/Infinity automático.</text><rect x="45" y="1099" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1128" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1158" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si el rival niega Core, no llega Emergency. Si niega Emergency, no llega el monstruo. Cyber Revsystem no</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">invoca del Deck y no inventa material Rango5. Core no puede activar su segundo efecto de Cementerio además</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del de búsqueda durante el mismo turno.</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
