<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual Chimera -&gt; Power Bond sin fusionar Máquinas genéricas"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  CYB-R10  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Chimera -&gt; Power Bond sin fusionar Máquinas genéricas</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cyber Dragon Pure con Cyberdark Chimera campo, al menos 1 Mágica/Trampa descartable en mano y Power Bond</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en Deck; no se usó Chimera este turno.</text><path d="M 537 238 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Confirma Power Bond disponible en Deck y al menos UNA Mágica/Trampa en mano para descarte.</text><path d="M 537 359 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa el efecto de Chimera: descarta esa M/T como COSTE, y después de responder la cadena añade Power</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Bond del Deck a mano si Chimera resuelve.</text><path d="M 537 503 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Ese uso restringe los materiales de toda Invocación por Fusión de este turno a monstruos «Cyber» Dragón</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">o Máquina. La autorización de desterrar material del GY se utiliza una sola vez cuando hagas una Fusión.</text><path d="M 537 647 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Antes de activar Power Bond, identifica una Fusión específica del Extra registrado y verifica que los</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruos de mano/campo/GY habilitados cubren los materiales impresos; no se incluye cualquier Máquina</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">genérica por tener la misma característica.</text><path d="M 537 814 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  FUSIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si Power Bond realiza la Fusión, duplica el ATK ORIGINAL del monstruo de Fusión y, en la End Phase,</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">recibes daño igual a ese ATK original. Separa el coste de Chimera de la activación posterior de Bond.</text><path d="M 537 958 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  FUSIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Sin materiales adecuados, la ruta cotejada TERMINA con Bond en mano: se prohíbe afirmar una Fusión</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">inexistente.</text><path d="M 537 1102 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Chimera convierte una M/T en un Power Bond en mano; Fusión opcional únicamente con requisito real,</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">restricciones y daño final de Power Bond.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Negación de Chimera después del descarte deja el coste gastado y Bond sin buscar. Si el único material</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ofrecido es una Máquina no-«Cyber», Chimera lo prohíbe; si no hay Bond Deck no hay búsqueda.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
