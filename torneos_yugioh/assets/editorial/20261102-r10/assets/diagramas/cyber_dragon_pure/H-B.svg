<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual H-B | CLOCKWORK NIGHT -&gt; FORTRESS"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  H-B  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">H-B | CLOCKWORK NIGHT -&gt; FORTRESS</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Cyber Dragon Core y Clockwork Night; campo rival: al menos un monstruo BOCA ARRIBA que pueda</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">convertirse en Máquina; Extra: Chimeratech Fortress Dragon. Normal libre.</text><path d="M 537 238 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca NORMALMENTE Cyber Dragon Core Nivel2. Mientras está en campo, su nombre se considera Cyber</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dragon, aunque no se vuelve Nivel5.</text><path d="M 537 382 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Noche Mecánica / Clockwork Night (Mágica Continua). Todos los monstruos BOCA ARRIBA de ambos</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">campos pasan a ser MÁQUINA por su efecto continuo.</text><path d="M 537 526 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Usa el Core boca arriba con nombre Cyber Dragon + al menos 1 monstruo Máquina rival boca arriba,</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">enviándolos AL GY mediante procedimiento de Invocación de Chimeratech Fortress Dragon desde Extra.</text><path d="M 537 670 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. NO usas Polimerización. Si usaste exactamente DOS monstruos, Fortress tiene ATK ORIGINAL 2000; mientras</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Clockwork Night siga boca arriba, gana +500 ATK por ser Máquina tuya: 2500 actual, sin otros</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">modificadores.</text><path d="M 537 837 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si un monstruo rival es inmune a Clockwork Night o no puede ser enviado al GY para este procedimiento,</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no asumas que el contacto funciona; comprueba su estado.</text><path d="M 537 981 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1001 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1015" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1044" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Core + Clockwork Night transforman en recurso de contacto el monstruo rival visible; Fortress con 2</text><text x="74" y="1097" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales, original 2000 ATK y actual 2500 si Night continúa.</text><rect x="45" y="1145" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1174" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No hay monstruo rival boca arriba o no puede usarse; Core negado en su nombre en campo, eliminado, o no se</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">puede enviar al GY; Fortress fuera del Extra. Clockwork Night no modifica monstruos boca abajo.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
