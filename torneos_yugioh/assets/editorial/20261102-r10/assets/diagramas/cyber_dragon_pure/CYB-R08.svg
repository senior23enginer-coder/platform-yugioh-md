<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1509" role="img" aria-label="Guía visual Horizon y no-Máquinas del Extra: corte real"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#20516e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#62bcf5"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">CYBER DRAGON PURE  ·  CYB-R08  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Horizon y no-Máquinas del Extra: corte real</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Horizonte Cibernético y Cyberdark Claw (DARK Dragón); Deck: Cyber Dragon Core (LIGHT Máquina), otro</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo «Cyber» buscable; Extra: Cyber Eternity Dragon (Máquina Fusión). No se Invocaron Extra no-Máquina</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">este turno.</text><path d="M 537 261 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Al activar Horizonte Cibernético, envía como COSTE 2 monstruos «Cyber» de atributos diferentes, UNO</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desde mano (Cyberdark Claw DARK) y UNO del Deck (Cyber Dragon Core LIGHT), ambos Dragón/Máquina válidos.</text><path d="M 537 405 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. El rival puede responder después de haber enviado AMBAS cartas; si niega el efecto, el envío por coste</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no se revierte.</text><path d="M 537 549 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Si resuelve, añade del Deck a mano 1 monstruo Dragón/Máquina «Cyber» real todavía disponible, por</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ejemplo Cyber Dragon original.</text><path d="M 537 693 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si efectivamente se añadió el monstruo, ENVÍA desde Extra al GY 1 monstruo Fusión «Cyber» de tipo</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Máquina, por ejemplo Cyber Eternity Dragon. No se Invoca en campo.</text><path d="M 537 837 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Este turno entero en el que activaste Horizon, NO puedes Invocar Especialmente monstruos del Extra que</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no sean MÁQUINA. Isolde, S:P, Azalea y otros Extra No-Máquina quedan incompatibles ANTES y DESPUÉS de la</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activación.</text><path d="M 537 1004 v 29" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. No confundas send de una Fusión desde Extra al GY con haberla Invocado apropiadamente; su resurrección</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">posterior dependerá de condiciones reales.</text><path d="M 537 1148 v 30" stroke="#62bcf5" stroke-width="4" fill="none"/><path d="M 528 1168 l 9 10 l 9 -10" stroke="#62bcf5" stroke-width="4" fill="none"/><rect x="45" y="1182" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1211" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Se enviaron dos Cyber de atributos opuestos como coste y una Fusión Máquina Cyber del Extra al GY, más una</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">búsqueda a mano; todo el turno mantiene bloqueo del Extra a Máquina.</text><rect x="45" y="1312" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1341" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Cyberdark Claw DARK mano o Core LIGHT Deck, sin Monster Cyber buscable o sin Fusión Máquina Cyber</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Extra, no afirmar toda la resolución. Si ya Invocaste Extra no-Máquina antes, activar Horizon ese turno es</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">incompatible.</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1502" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
