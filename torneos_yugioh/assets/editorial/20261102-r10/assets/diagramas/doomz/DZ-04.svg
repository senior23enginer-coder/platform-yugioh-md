<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1486" role="img" aria-label="Guía visual DZ-04 | Drastea equipada -&gt; Drastrius Rango 8"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-04  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-04 | Drastea equipada -&gt; Drastrius Rango 8</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: DoomZ XII Cero - Drastea Nivel8. Campo: otra carta DoomZ propia boca arriba (por ejemplo, Elara).</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck: Equip Spell Mando DoomZ «D.O.O.M.D.U.R.G.». Extra: Drastrius WIND Máquina Rango8.</text><path d="M 537 238 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  DESTRUCCIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Desde mano activa primer efecto de Drastea SELECCIONANDO una carta DoomZ que controlas (por ejemplo,</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Elara) para destruirla al resolver.</text><path d="M 537 382 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si la destrucción ocurre, Invoca Especialmente Drastea Nivel8 desde mano y puedes EQUIPAR directamente</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desde Deck el Equipo DoomZ D.O.O.M.D.U.R.G. a Drastea.</text><path d="M 537 526 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  XYZ</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Ahora Drastea realmente está equipada: durante una ventana de Efecto Rápido activa su segunda</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">habilidad. Selecciona desde Extra un XYZ Máquina VIENTO de RANGO IGUAL a su Nivel8: DoomZ XII Fin -</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Drastrius Rango8.</text><path d="M 537 693 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Invoca Drastrius tratándolo como Invocación Xyz; acopla Drastea Y su carta equipada como materiales al</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">nuevo Xyz. No exige colocar otros dos monstruos Nivel8 sobre el campo.</text><path d="M 537 837 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si está disponible el efecto de Drastrius por ser Invocado Xyz, puedes equiparle OTRO monstruo boca</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">arriba del campo; requiere objetivo presente en el campo. Su negación de efectos de monstruo de campo/GY</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">requiere separar 1 material.</text><path d="M 537 1004 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. No confundir el ATK2700 de Drastrius con el ATK2400 de Drastea anterior.</text><path d="M 537 1125 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Drastea equipada puede materializar Drastrius Rango8 con 2 materiales (Drastea+Equipo) y 2700 ATK base; la</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ruta utiliza una DoomZ propia destruida.</text><rect x="45" y="1289" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin otra carta DoomZ controlada a la que pueda seleccionar y destruir, no se Invoca Drastea por ese</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efecto; sin Equipo disponible en Deck, aún puede invocarse Drastea, pero NO se habilita la Invocación Xyz</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de su segundo efecto sin equipamiento real.</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
