<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1532" role="img" aria-label="Guía visual DZ-09 | Vidrium como escala, no como jefe invocable"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-09  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-09 | Vidrium como escala, no como jefe invocable</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ: carta registrada bajo el nombre preliminar «Vidrium, Modelo de Poder de la Exterminación del Caos»</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en MANO; identidad técnica oficial «Vidolium the Unstable Power Patron of Unity» (Nivel12, Escala11); 1</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Power Patron propio en mano o GY si se busca invocarlo.</text><path d="M 537 261 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Reconoce la equivalencia editorial: «Vidrium» era nombre traducido preliminar; Neuron identifica el</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mismo concepto por «Vidolium the Unstable Power Patron of Unity». Mantén el nombre tal como registró el</text><text x="74" y="398" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">usuario, anotando alias.</text><path d="M 537 428 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 447 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="460" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="489" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Desde MANO, activa Vidolium como carta Péndulo en una Zona Péndulo libre: escala 11. Colocarla no</text><text x="74" y="542" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">equivale a Invocarla como monstruo.</text><path d="M 537 572 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 591 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="604" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="633" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Durante Main Phase, si tienes Power Patron en mano o GY, activa su efecto de Péndulo: destruye la</text><text x="74" y="686" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">propia carta en la zona y, si se destruyó, Invoca especialmente ese Power Patron desde mano/GY.</text><path d="M 537 716 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 735 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="748" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="777" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. La opción ALTERNATIVA destruye Vidolium y da +5000 ATK durante el turno a Power Patrons en tu campo de</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel original12; no es acumulable con la opción de Invocar.</text><path d="M 537 860 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  BÚSQUEDA</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Al destruirse desde Zona Péndulo y pasar boca arriba al Extra, Vidolium puede buscar 1 carta Power</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron del Deck en cadena posterior, según efecto de monstruo. No tomar búsqueda antes de ingresar al</text><text x="74" y="997" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Extra.</text><path d="M 537 1027 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1046 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1059" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1088" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Como monstruo Vidolium NO se puede Normal Invocar; Invocación Especial desde GY o Extra exige devolver</text><text x="74" y="1141" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">al Extra TRES monstruos distintos: 1 Fusion, 1 Synchro y 1 Xyz de campo boca arriba/GY. El DoomZ actual no</text><text x="74" y="1164" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">garantiza por sí mismo esos tres.</text><path d="M 537 1194 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1214 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1228" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1257" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Vidrium/Vidolium es Péndulo de Escala11 útil para extender Power Patron o ganar ATK condicionado; NO es un</text><text x="74" y="1310" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">jefe de Invocación gratuita desde mano.</text><rect x="45" y="1358" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1387" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Power Patron mano/GY, no se invoca por la primera opción. No colocar desde el Extra boca arriba por</text><text x="74" y="1440" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">regla ordinaria. Sin Fusion+Synchro+Xyz no se Invoca Vidolium como monstruo.</text><text x="48" y="1502" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1525" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
