<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1342" role="img" aria-label="Guía visual DZ-03 | Elara coloca Cambio/Incursores"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-03  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-03 | Elara coloca Cambio/Incursores</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: DoomZ VII Siete - Elara. Invocación Normal libre, Incursores DoomZ en Deck, Amalthe en Deck, Drastea</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en Deck; efecto de cada nombre no usado.</text><path d="M 537 238 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca NORMALMENTE Elara Nivel4. Su disparador de Invocación coloca UNA Mágica/Trampa DoomZ desde Deck:</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">elige Incursores DoomZ (Raiders, MÁGICA CONTINUA). Queda primero colocada boca abajo.</text><path d="M 537 382 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En tu Main Phase, activa la Mágica Continua Raiders colocada este mismo turno, opción permitida para</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mágicas normales/continuas (no Trampas recién colocadas).</text><path d="M 537 526 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa Raiders boca arriba: al resolver, DESTRUYE OTRA carta DoomZ, Elara en campo; después Invoca</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Especialmente Amalthe desde Deck, si se cumplen las condiciones. Desde aquí, tu Extra queda restringido a</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">XYZ el resto del turno.</text><path d="M 537 693 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Amalthe fue Invocada Especialmente: en nueva cadena puede añadir DoomZ XII Cero - Drastea desde Deck a</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mano. Buscar NO equivale a invocar Drastea.</text><path d="M 537 837 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Elara fue destruida por efecto, pero ya usaste su primer efecto ese turno al Invocarla: NO vuelvas a</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">colocar otra DoomZ mediante la misma cláusula en ese turno.</text><path d="M 537 981 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1001 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1015" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1044" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Elara de mano produce Raiders boca arriba + Amalthe en campo + Drastea en mano; Elara fue destruida, Extra</text><text x="74" y="1097" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">solo Xyz por el resto del turno. Sin activación de Trampa recién colocada.</text><rect x="45" y="1145" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1174" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Raiders está en mano o no disponible en Deck, adaptaría la apertura; si la Invocación de Elara es</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">negada, no se coloca Raiders; si falta Amalthe o Drastea en Deck, no afirmar el final descrito; si Raiders</text><text x="74" y="1250" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no destruye Elara, no se completa esa rama.</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1335" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
