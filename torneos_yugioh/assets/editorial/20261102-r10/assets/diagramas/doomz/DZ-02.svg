<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual DZ-02 | Cambio DoomZ destruye buscador en Deck"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-02  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-02 | Cambio DoomZ destruye buscador en Deck</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Cambio DoomZ. Deck: al menos 1 DoomZ Modelo de Poder y 1 Elara, sin haber usado la búsqueda de</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Modelo de Poder este turno. Normal libre.</text><path d="M 537 238 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  DESTRUCCIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa la Mágica Normal Cambio DoomZ; su efecto permite destruir una carta DoomZ de mano, Deck o campo</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">propio boca arriba (no a sí misma).</text><path d="M 537 382 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Elige DoomZ Modelo de Poder que esté en tu Deck y DESTRÚYELO por el efecto de Cambio. No pasa a tu mano</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ni entra al campo.</text><path d="M 537 526 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  DESTRUCCIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Al ser destruido, activa el disparador de DoomZ Modelo de Poder en nueva cadena para añadir 1 carta</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ desde Deck a mano; por ejemplo DoomZ VII Seven - Elara si permanece en Deck.</text><path d="M 537 670 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Termina aquí la secuencia garantizada: Elara se queda en mano, NO se Invoca automáticamente. Todavía</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">podrás usar una Invocación Normal u otro efecto legal para extender.</text><path d="M 537 814 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Rama alternativa con Amalthe: si destruyes DoomZ V Five - Amalthe en Deck, su disparador permite añadir</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">únicamente otro MONSTRUO DoomZ distinto; no tratar ambas búsquedas como idénticas.</text><path d="M 537 958 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cambio DoomZ consumido, Power Patron DoomZ destruido y enviado a GY, carta DoomZ concreta añadida a mano</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(o monstruo distinto con Amalthe). Sin Invocación gratis.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin objetivo DoomZ destruible en Deck, no existe ruta. Si se niega el disparador de búsqueda, no hay</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">adición. No mezclar la búsqueda de cualquier carta DoomZ de Modelo de Poder con la búsqueda solo de</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo que ofrece Amalthe.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
