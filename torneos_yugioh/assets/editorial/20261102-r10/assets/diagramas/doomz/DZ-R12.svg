<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1486" role="img" aria-label="Guía visual Medius + Power Patron: Diactorus concreto"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-R12  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Medius + Power Patron: Diactorus concreto</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ: Medius the Pure Nivel4 en mano, Normal libre; Power Patron DoomZ Nivel1 en Deck; DoomZ Break -</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Diactorus Rango4 en Extra; una carta DoomZ propia en mano o campo boca arriba para su destrucción</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">opcional.</text><path d="M 537 261 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente a Medius Nivel4, activa su efecto de Invocación y elige Invocar Especialmente Power</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron DoomZ del Deck al campo.</text><path d="M 537 405 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Patrono DoomZ es Nivel1 Máquina y mientras está en campo solo permite Invocaciones Especiales Xyz del</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Extra; prohíbe plan Link/Synchro bajo su presencia.</text><path d="M 537 549 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa Patrono y selecciona OTRO monstruo de EFECTO propio, Medius Nivel4. Del Extra Invoca DoomZ Break</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">- Diactorus Rango4 usando SOLO Medius seleccionado como material; después Patrono equipa al Xyz.</text><path d="M 537 693 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Diactorus invocada activa su disparador: si existe otra carta «DoomZ» en mano/campo boca arriba, puedes</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destruirla y luego destruir opcionalmente un monstruo en campo. Destruirla no es obligatorio para</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">conservar Diactorus.</text><path d="M 537 860 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  BÚSQUEDA</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si la carta destruida fue el propio Patrono que está equipado, su efecto al destruirse puede buscar</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ del Deck, pero NO conservas luego ese Equip en Diactorus.</text><path d="M 537 1004 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  XYZ</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Una sola Diactorus Rango4 NO genera F0 Utopic Draco Future: para ello exige segundo Xyz mismo rango;</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">consultar DZ-07 como extensión separada.</text><path d="M 537 1148 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1168 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1182" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1211" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Medius Nivel4→Patrono DoomZ Nivel1→Diactorus Rango4 con Medius como único material y Patrono como equipo;</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destrucción de una DoomZ real opcional.</text><rect x="45" y="1312" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1341" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Medius efecto o Patrono en Deck no surge línea. Si Medius no está boca arriba cuando Patrono lo</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">selecciona, falta blanco. Si no hay DoomZ para destruir, Diactorus existe sin la segunda destrucción.</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
