<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual DZ-06 | Xyz DoomZ -&gt; Graflareio -&gt; buscar soporte"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-06  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-06 | Xyz DoomZ -&gt; Graflareio -&gt; buscar soporte</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Controlas un Xyz «DoomZ» real, por ejemplo Drastrius Rango8; Extra contiene DoomZ XIII Over - Graflareio</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Rango5; Deck contiene una Mágica/Trampa DoomZ buscable.</text><path d="M 537 238 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  XYZ</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Comprueba que tu monstruo en campo sea XYZ de arquetipo DoomZ y que Graflareio esté en Extra.</text><path d="M 537 359 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Aunque Graflareio es Rango5 y Drastrius Rango8, su texto autoriza superponer sobre UN Xyz DoomZ que</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">controles. Realiza esa Invocación Xyz alternativa y transfiere materiales.</text><path d="M 537 503 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  XYZ</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Graflareio tiene al menos 1 material: el Xyz anterior, más los que transfirió. En Main Phase activa su</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efecto separando exactamente 1 material como COSTE.</text><path d="M 537 647 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si resuelve, añade 1 Mágica/Trampa DoomZ del Deck a mano; por ejemplo DoomZ Raiders si está allí.</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Buscar coloca en MANO, no activa ni Invoca esa carta.</text><path d="M 537 791 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Luego puedes destruir 1 carta EN EL CAMPO. El efecto de destruir es opcional y sucede al resolver</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DESPUÉS de la búsqueda; no inventes seleccionar objetivo en activación.</text><path d="M 537 935 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si el Graflareio es destruido por EFECTO de carta, otro disparador puede Invocar un DoomZ que NO sea</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Xyz desde Deck o GY, sujeto a disponibilidad.</text><path d="M 537 1079 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Un XYZ DoomZ existente puede evolucionar a Graflareio Rango5 y buscar soporte DoomZ a mano a cambio de</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">separar un material, con destrucción opcional de campo.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin un XYZ DoomZ disponible no puedes saltar a Graflareio por esta opción; sin materiales tras superponer</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no puedes pagar separación; sin soporte en Deck no hay búsqueda.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
