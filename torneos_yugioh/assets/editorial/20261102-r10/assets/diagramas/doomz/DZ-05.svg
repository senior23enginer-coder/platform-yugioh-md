<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1630" role="img" aria-label="Guía visual DZ-05 | Medius -&gt; Jupredo/Zegredo -&gt; Júpiter"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-05  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-05 | Medius -&gt; Jupredo/Zegredo -&gt; Júpiter</text><rect x="45" y="126" width="984" height="155" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ: «Modelo de Poder Máquina de Sombras Zegredo», alias japonés original de Jupredo the Shademachine</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Power Patron, está realmente en Deck. DoomZ: Medius the Pure mano, Normal libre; Jupredo Shademachine</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Power Patron en Deck, Jupiter Power Patron of Destruction en Extra; tres cartas superiores en Deck para</text><text x="74" y="254" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desterrar boca abajo.</text><path d="M 537 284 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 303 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="316" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="345" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente Medius Nivel4; su disparador permite Invocar Especialmente desde Deck un «Power</text><text x="74" y="398" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron», elige Jupredo Nivel10, no añadirla a mano.</text><path d="M 537 428 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 447 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="460" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="489" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  DESTIERRO</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Jupredo ahora es un MONSTRUO en campo, no en una Zona de Péndulo. Activa su efecto de monstruo:</text><text x="74" y="542" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destierra las tres cartas superiores de TU Deck BOCA ABAJO como coste.</text><path d="M 537 572 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 591 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="604" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="633" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Al resolver, destruye a Jupredo en campo; si la destruye, Invoca Jupiter desde Extra, lo que cuenta</text><text x="74" y="686" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como Invocación Xyz según el texto de Jupredo.</text><path d="M 537 716 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 735 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="748" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="777" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  DESTRUCCIÓN</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Tras Jupiter puedes acoplar opcionalmente una carta de tu mano como material, de manera que Jupiter</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">tenga al menos una para desacoplar. Jupredo destruida va boca arriba al Extra por ser Péndulo desde campo.</text><path d="M 537 860 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  BÚSQUEDA</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Al añadirse Jupredo boca arriba al Extra, en nueva cadena puede buscar una Mágica/Trampa DoomZ o Power</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron del Deck (si el efecto está disponible); no es búsqueda antes de su destrucción.</text><path d="M 537 1004 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Jupiter NO gana +3000 ATK por haber sido Invocada de Jupredo sin material Xyz bajo ella: tal bono</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">requiere un monstruo XYZ como material. Si se acopló carta de mano normal, tiene 3500 ATK base.</text><path d="M 537 1148 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1167 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1180" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1209" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 07  /  INVOCACIÓN</text><text x="74" y="1239" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">7. Con material disponible y DoomZ válido en Cementerio, Jupiter puede desacoplar uno para Invocar ese</text><text x="74" y="1262" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ del GY y luego destruir opcionalmente una carta en campo.</text><path d="M 537 1292 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1312 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1326" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1355" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1385" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Medius→Jupredo→Jupiter Xyz R10, potencial búsqueda M/T tras Jupredo al Extra; bono +3000 solo con material</text><text x="74" y="1408" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Xyz real, y revivir requiere GY.</text><rect x="45" y="1456" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1485" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si se niega Jupredo tras desterrar 3 boca abajo, no Invoca Jupiter. Sin material, Jupiter no desacopla.</text><text x="74" y="1538" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin DoomZ en GY no promete revivir. Sin carta para acoplar el Jupiter puede quedar sin materiales.</text><text x="48" y="1600" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1623" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
