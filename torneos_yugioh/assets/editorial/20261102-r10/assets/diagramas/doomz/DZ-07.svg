<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual DZ-07 | Dos Diactorus -&gt; Futuro Utópico -&gt; Draco Utópico"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-07  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-07 | Dos Diactorus -&gt; Futuro Utópico -&gt; Draco Utópico</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ con DOS copias de DoomZ Break - Diactorus (Rango4) YA Invocadas legalmente en campo; ambas aún son</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Xyz de Rango4 y no son «Number»; F0 y F0 Draco Future en Extra.</text><path d="M 537 238 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Comprueba que ambas Diactorus están SOBRE EL CAMPO AL MISMO TIEMPO, no solo disponibles en Extra o GY.</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cada una necesita método previo real de Invocación.</text><path d="M 537 382 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Opcionalmente usa sus efectos de Invocación cuando se abrieron, pero eso no crea materiales nuevos: la</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">condición para continuar es conservar AMBAS Diactorus.</text><path d="M 537 526 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Superpone dos monstruos Xyz del MISMO Rango (dos Diactorus Rango4, ninguna es «Number») para Invocar</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Number F0: Utopic Future. Sus materiales se transfieren según el procedimiento.</text><path d="M 537 670 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Superpone Number F0: Utopic Future como material de Number F0: Utopic Draco Future mediante su</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">procedimiento impreso y transfiere sus materiales.</text><path d="M 537 814 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Draco Future no se destruye por batalla/efecto; una vez por turno cuando el rival activa efecto de</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo, puede desacoplar 1 material para negar la ACTIVACIÓN, luego ganar control de ese monstruo si</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">continúa en campo.</text><path d="M 537 981 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  XYZ</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Esta ruta es de TABLERO PREARMADO; no declares que un solo Medius da dos Diactorus simultáneos ni hagas</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">F0 con un solo Xyz.</text><path d="M 537 1125 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dos Diactorus reales→F0 Utopic Future→F0 Utopic Draco Future, con materiales transferidos y negación de</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activación una vez por turno si existe material.</text><rect x="45" y="1289" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con una sola Diactorus, o con una Diactorus retirada al encadenar, no se puede invocar F0. Dos Xyz de</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rango distinto tampoco. No confundir F0 Future con F0 Utopic Future ZEXAL (otra carta de Extra).</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
