<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1175" role="img" aria-label="Guía visual DZ-01 | Medius -&gt; DoomZ Modelo de Poder -&gt; Diactorus"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-01  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-01 | Medius -&gt; DoomZ Modelo de Poder -&gt; Diactorus</text><rect x="45" y="126" width="984" height="86" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Medius el Puro en mano, Invocación Normal disponible; DoomZ Modelo de Poder en Deck, Diactorus en Extra.</text><path d="M 537 215 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 234 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="247" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="276" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="306" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca Normalmente Medius. Al resolver su efecto, Invoca Especialmente DoomZ Modelo de Poder desde el Deck</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(es un monstruo Modelo de Poder).</text><path d="M 537 359 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con DoomZ Modelo de Poder en Campo, selecciona a Medius, Monstruo de Efecto Nivel 4 propio.</text><path d="M 537 480 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 499 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="512" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="541" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="571" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca Xyz Fractura DoomZ - Diactorus (Rango 4), usando Medius como material; DoomZ Modelo de Poder pasa a</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">equiparlo. Esta Invocación se trata como Xyz.</text><path d="M 537 624 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 643 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="656" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="685" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="715" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Diactorus activó su efecto al ser Invocado y controlas una carta DoomZ destruible, puedes destruirla y</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">después destruir un monstruo del Campo. Si destruyes tu DoomZ Modelo de Poder equipado, se abre su</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">búsqueda al ser destruido.</text><path d="M 537 791 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 811 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="825" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="854" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="884" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Diactorus con material y acceso a otra carta DoomZ; el paso de destrucción es opcional y depende de</text><text x="74" y="907" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">objetivos/estado.</text><rect x="45" y="955" width="984" height="155" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="984" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1014" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si Medius es negado, no se obtiene DoomZ Modelo de Poder por esta ruta. Si quitan al Medius antes de</text><text x="74" y="1037" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">resolver el efecto de conversión, se pierde el objetivo. PRUEBA DE REGLAS: La equipación y su destrucción</text><text x="74" y="1060" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efectiva, objetivos y bloqueos de Invocación deben seguir vigentes. Patrono no es material Xyz por este</text><text x="74" y="1083" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">procedimiento; Medius sí.</text><text x="48" y="1145" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1168" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
