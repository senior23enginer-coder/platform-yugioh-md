<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual DZ-11 | Destrucción DoomZ como bloqueo de búsquedas"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-11  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">DZ-11 | Destrucción DoomZ como bloqueo de búsquedas</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Controlas un monstruo XYZ DoomZ boca arriba (por ejemplo Drastrius); tienes Destrucción DoomZ colocada</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">LEGALMENTE desde turno previo; el rival pretende añadir cartas de Main Deck a mano.</text><path d="M 537 238 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  XYZ</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Con Drastrius u otro XYZ DoomZ en campo, ACTIVA Destrucción DoomZ (Trampa Normal en origen) desde la</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">zona Mágicas/Trampas donde estaba colocada.</text><path d="M 537 382 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  XYZ</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Selecciona un monstruo XYZ DoomZ propio en campo, por ejemplo Drastrius; al resolver equipa esta misma</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Trampa a ese monstruo.</text><path d="M 537 526 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Mientras siga equipada, se aplica la restricción otorgada al monstruo: el adversario NO puede añadir</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cartas de su Main Deck a la mano EXCEPTO robándolas.</text><path d="M 537 670 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Esa restricción bloquea búsquedas desde Main Deck a mano, pero NO bloquea los robos normales o por</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efectos ni las Invocaciones desde Deck al campo.</text><path d="M 537 814 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si el monstruo equipado deja campo o la Trampa equipada se destruye, ya no afirmes una restricción</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permanente. En caso de destrucción por EFECTO de la Trampa, existe un segundo efecto que requiere</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">objetivos reales y comprobación independiente.</text><path d="M 537 981 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 1001 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="1015" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1044" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Xyz DoomZ equipado con Destrucción DoomZ; el adversario tiene restringidas adiciones por búsqueda desde</text><text x="74" y="1097" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Main Deck, no los robos.</text><rect x="45" y="1145" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1174" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Xyz DoomZ controlado no se puede seleccionar/equipar; la Trampa recién colocada no se puede activar</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">normalmente ese turno; si se pierde la Trampa/monstruo, cesa el efecto otorgado.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
