<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1129" role="img" aria-label="Guía visual Cambio + Amalthe: búsqueda del buscador"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#4a2867" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ad7de6"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">DOOMZ  ·  DZ-R13  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Cambio + Amalthe: búsqueda del buscador</text><rect x="45" y="126" width="984" height="86" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Cambio DoomZ. Deck: DoomZ V Five - Amalthe y DoomZ VII Seven - Elara; efecto de Amalthe sin usar.</text><path d="M 537 215 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 234 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="247" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="276" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="306" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa Cambio DoomZ y al resolver DESTRUYE DoomZ V Five - Amalthe en el Deck (no se añade a mano ni se</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca).</text><path d="M 537 359 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  DESTRUCCIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Amalthe fue destruida por efecto: en NUEVA cadena, usa su disparador opcional para añadir un monstruo</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DoomZ DIFERENTE DE AMALTHE desde Deck.</text><path d="M 537 503 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Por ejemplo, busca Elara. Elara va a MANO; no al campo. Revisa si tienes Invocación Normal libre o un</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efecto real posterior para ponerla en juego.</text><path d="M 537 647 v 29" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  BÚSQUEDA</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Contrasta con DoomZ Modelo de Poder: éste busca cualquier carta DoomZ al ser destruido; Amalthe busca</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">únicamente un monstruo DoomZ distinto de sí mismo.</text><path d="M 537 791 v 30" stroke="#ad7de6" stroke-width="4" fill="none"/><path d="M 528 811 l 9 10 l 9 -10" stroke="#ad7de6" stroke-width="4" fill="none"/><rect x="45" y="825" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="854" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="884" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cambio termina en Cementerio; Amalthe destruida termina en Cementerio; Elara queda en mano. No concede</text><text x="74" y="907" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocación Especial gratis ni añade una segunda búsqueda de la misma Amalthe.</text><rect x="45" y="955" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="984" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1014" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Amalthe no está en Deck o su búsqueda ya se usó ese turno; no queda monstruo DoomZ distinto buscable; el</text><text x="74" y="1037" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rival niega el disparador después de destrucción.</text><text x="48" y="1099" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1122" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
