<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1509" role="img" aria-label="Guía visual I-F | EMPEROR COMO CIERRE"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  I-F  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">I-F | EMPEROR COMO CIERRE</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Volcanic Emperor en mano o GY; al menos TRES monstruos Piro reales en tu GY o entre campo boca arriba/GY</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">que puedan desterrarse; Deck: una Trampa «Volcanic» (Inferno o Emission).</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Emperador Volcánico NO puede Invocarse normalmente. Su procedimiento exige desterrar 3 monstruos PYRO,</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">o ALTERNATIVAMENTE 1 carta Blaze Accelerator válida desde campo boca arriba/GY.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  DESTIERRO</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Para la opción de mayor daño, destierra TRES Piro concretos de tus recursos reales (por ejemplo tres</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scattershot ya enviadas a GY): no destierres cartas genéricas que no sean Piro.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Mediante ese procedimiento Invoca Especialmente Volcanic Emperor desde mano o GY. La primera vez este</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno; esta invocación no gasta Normal.</text><path d="M 537 670 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Por haber sido Invocado de esa manera, activa su disparador: si desterraste 3 Piro, puede infligir</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3×500 = 1500 daño al rival; después, si hay una Trampa Volcanic en Deck, puedes COLOCARLA boca abajo desde</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Deck.</text><path d="M 537 837 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  ACTIVACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. La Trampa recién colocada NO se puede activar ese mismo turno sin habilitación adicional; tampoco</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">confundas desterrar 1 Blaze Accelerator con 3 Pyro: con 1 Accelerator, el daño inicial por Piro</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desterrados es 0.</text><path d="M 537 1004 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1023 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1036" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1065" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Mientras el Emperador esté en campo, cada vez que adversario Invoca Especialmente monstruo(s) el texto</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">inflige 500 daño por EVENTO de Invocación, no automáticamente 500 por cada monstruo de una Invocación</text><text x="74" y="1141" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">simultánea.</text><path d="M 537 1171 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1191 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1205" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1234" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Emperor desde mano/GY consumiendo 3 Piro reales; hasta 1500 daño inmediato + Trampa Volcanic colocada;</text><text x="74" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">presión adicional de 500 por evento de Invocación Especial rival.</text><rect x="45" y="1335" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1364" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin 3 Pyro ni Accelerator legal no se Invoca. Si se opta por 1 Accelerator, no cuentan 3 Piro desterrados.</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Trampa Volcanic en Deck no declarar Colocación.</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1502" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
