<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual I-D | RIMFIRE PARA ACCESO"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  I-D  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">I-D | RIMFIRE PARA ACCESO</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Main Phase: Blaze Accelerator Reload en GY; Rimfire y al menos 2 Volcanic Shell en Deck; más de 500 LP;</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efectos de Rimfire y Shell libres.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa desde GY el efecto de Blaze Accelerator Reload: DESTIÉRRALA como COSTE y declara el envío</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permitido desde Deck.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si resuelve, envía exactamente 1 Volcanic Rimfire desde Deck al GY. No afirmes que Rimfire fue</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">descartada desde mano.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En cadena nueva, Rimfire fue enviada al GY y puede activar la PRIMERA de sus opciones: al resolver</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DESTIÉRRALA del GY y, si lo haces, manda Volcanic Shell del Deck al GY.</text><path d="M 537 670 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Con Shell realmente en GY, activa su efecto; PAGA 500 LP al activar; cuando resuelve y la Shell sigue</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">en GY, añade otra copia de Shell del Deck a mano.</text><path d="M 537 814 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Resultado: Reload y Rimfire desterradas, Shell original en GY, otra Shell en mano; las cartas no van</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Deck al campo.</text><path d="M 537 958 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Desde Reload en cementerio se habilita envío real Rimfire→Shell y recuperación de una segunda Shell a mano</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">a cambio de 500 LP.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Reload en GY, Rimfire Deck, dos Shell Deck o LP suficientes no se completa; negar envío desde Reload</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">impide disparador de Rimfire; Rimfire desterrada en respuesta no cumple su primera opción; Shell debe</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permanecer GY al activar Y al resolver.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
