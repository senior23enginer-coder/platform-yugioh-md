<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1296" role="img" aria-label="Guía visual I-A | ROCKET + RELOAD"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  I-A  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">I-A | ROCKET + RELOAD</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Volcanic Rocket; Normal libre. Deck: Blaze Accelerator Reload (Trampa Continua); una zona de</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Magia/Trampa libre.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente Volcanic Rocket (Pyro Nivel4).</text><path d="M 537 359 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En su disparador al ser Invocado, añade Blaze Accelerator Reload desde Deck o Cementerio a la mano. Es</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">una Trampa Continua cuyo nombre incluye &#x27;Blaze Accelerator&#x27;.</text><path d="M 537 503 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Coloca Reload boca abajo en zona de Magia/Trampa. Por regla general, no puede activarse durante el</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mismo turno en que fue colocada; NO la trates como Mágica Continua.</text><path d="M 537 647 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. En la siguiente ventana legal, normalmente una Main Phase del rival, activa Reload. Si queda boca</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">arriba, durante una Main Phase puedes enviar 1 carta &#x27;Volcanic&#x27; de mano al GY y después robar 1; requiere</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">una carta real en mano para ese envío.</text><path d="M 537 814 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  CEMENTERIO</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Su efecto desde Cementerio es distinto: durante Main Phase, desterrar Reload del GY permite enviar una</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">carta Volcanic del Deck al GY; NO está disponible mientras Reload continúa colocada o boca arriba.</text><path d="M 537 958 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Rocket boca arriba + Reload colocada al final del turno inicial; acceso posterior al ciclo Volcanic</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">condicionado a activar la Trampa en una ventana válida.</text><rect x="45" y="1122" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Rocket negado; ninguna Reload en Deck/GY; zona M/T ocupada; intentar activar la Trampa recién colocada; no</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">tener carta Volcanic de mano para el ciclo de robo.</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
