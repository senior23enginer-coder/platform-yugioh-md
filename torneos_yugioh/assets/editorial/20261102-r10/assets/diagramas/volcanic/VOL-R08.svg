<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual Emperador desde tres Piro: presión de daño"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  VOL-R08  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Emperador desde tres Piro: presión de daño</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Volcanic Emperor en GY o mano. Tres monstruos Piro verificables en GY (Rimfire, Shell y Scattershot, por</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ejemplo); Trampa Volcanic en Deck.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Primero cuenta 3 Piro auténticos en GY/campo propio boca arriba. No cuentan Mágicas, Trampas ni</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruos que no sean Tipo Piro.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Destierra los 3 Piro para cumplir procedimiento de Invocación Especial de Emperor desde mano o GY.</text><path d="M 537 503 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Cuando Emperor fue Invocado de esa manera, su disparador puede infligir 500 por cada Piro desterrado</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(aquí 1500); después puede COLOCAR Volcanic Inferno/Emission desde Deck si está disponible.</text><path d="M 537 647 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. No declares activación de la Trampa en este mismo turno si fue colocada por este efecto y no existe</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permiso adicional.</text><path d="M 537 791 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Cuando el rival efectúe una Invocación Especial de uno o varios monstruos en un solo evento, Emperor</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">inflige 500 por evento, no 500 multiplicado por cada carta de ese mismo evento.</text><path d="M 537 935 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si en cambio se usa 1 carta Blaze Accelerator para invocarlo, la quemadura al ser Invocado cuenta 0</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Piro desterrados; separa claramente las rutas.</text><path d="M 537 1079 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Ruta de cierre con 3 Piro: Emperor real + hasta 1500 por Invocación y 500 por evento Special rival</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">posterior.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No hay 3 Piro disponibles, Emperor no está mano/GY, efecto negado, Trampa buscable agotada o no puede</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">sostenerse Emperor ante remoción rival.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
