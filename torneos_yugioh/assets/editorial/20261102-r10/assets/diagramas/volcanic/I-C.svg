<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1129" role="img" aria-label="Guía visual I-C | SHELL COMO MUNICIÓN"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  I-C  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">I-C | SHELL COMO MUNICIÓN</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Campo: Blaze Accelerator Reload ya boca arriba y legalmente activada en una Main Phase. Mano: Volcanic</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Shell. Deck: al menos otra Shell. LP: más de 500 para continuar después del pago.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. En Main Phase, activa el efecto de Blaze Accelerator Reload boca arriba. Al resolver ENVÍA Volcanic</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Shell desde mano al GY Y, si lo hiciste, roba exactamente 1 carta.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Como Shell está ahora realmente en GY, activa su efecto una vez por turno: PAGA 500 LP como COSTE antes</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de responderse la cadena.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Al resolver sin negación y con una copia restante, añade otra Volcanic Shell desde Deck a mano.</text><path d="M 537 647 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  DESTIERRO</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Shell necesita estar en Cementerio tanto para ACTIVAR como para RESOLVER; si se destierra en respuesta,</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no termina recuperando la copia como si nada.</text><path d="M 537 791 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 811 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="825" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="854" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="884" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Reload cambia una Shell de mano por una carta robada; después 500 LP obtienen una Shell nueva de Deck. El</text><text x="74" y="907" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">valor real depende de conservar Shell en GY y una copia en Deck.</text><rect x="45" y="955" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="984" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1014" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Reload no estaba activa; falta Shell en mano/Deck; sin 500 LP; interrupción que retira Shell del</text><text x="74" y="1037" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cementerio en cadena; negación de Reload o Shell.</text><text x="48" y="1099" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1122" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
