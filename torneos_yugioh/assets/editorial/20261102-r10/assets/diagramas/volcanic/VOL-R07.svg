<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1273" role="img" aria-label="Guía visual Reload en GY -&gt; Scattershot: limpieza y 1500 daño"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  VOL-R07  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Reload en GY -&gt; Scattershot: limpieza y 1500 daño</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Recarga del Acelerador de Llama YA en GY, tres Scattershot disponibles (uno en Deck y dos en mano/Deck),</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Main Phase, no hay reemplazo de GY</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  DESTIERRO</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Durante Main Phase, destierra Reload del GY y manda una Scattershot del Deck al GY por su EFECTO.</text><path d="M 537 359 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Scattershot enviada por efecto Blaze Accelerator inflige 500 daño al resolver su disparador.</text><path d="M 537 480 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 499 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="512" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="541" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  DESTRUCCIÓN</text><text x="74" y="571" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Por su otro efecto, manda las otras dos Scattershot desde Deck/mano al GY y destruye todos los monstruos</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del rival si resuelve.</text><path d="M 537 624 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 643 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="656" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="685" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="715" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Las otras dos Scattershot enviadas al GY pueden producir 500 de daño cada una; total nominal 1500 sin</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">otros modificadores.</text><path d="M 537 768 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 787 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="800" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="829" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="859" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Verifica las ventanas de cadena y si el rival tiene protección frente a destrucción/daño.</text><path d="M 537 889 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 909 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="923" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="952" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="982" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Objetivo: Reload en GY -&gt; Scattershot: limpieza y 1500 daño. Confirmar estado final y restricciones</text><text x="74" y="1005" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">conforme a cada paso.</text><rect x="45" y="1053" width="984" height="155" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1082" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1112" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">NO iniciar si Reload sigue colocada en campo sin haber llegado al GY; no sustituir por Fire Ejection o</text><text x="74" y="1135" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Volcanic Blaze Accelerator (envía Piro Nivel1). PRUEBA DE REGLAS: Las tres Scattershot deben estar</text><text x="74" y="1158" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">disponibles en las zonas que pide su texto; no hay limpieza si la primera no llega por efecto de Blaze</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Accelerator, o si la cadena se interrumpe.</text><text x="48" y="1243" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
