<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1607" role="img" aria-label="Guía visual Extravagancia: plan de turno sin robo posterior"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  VOL-R10  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Extravagancia: plan de turno sin robo posterior</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Volcanic con Olla de la Extravagancia en mano y 15 cartas en Extra; Main Phase1 acaba de comenzar, aún no</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">hubo acciones en esa fase; en el Deck están las líneas Rocket/Reload que podrían robar en otros turnos.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  DESTIERRO</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. SOLO al inicio de tu Main Phase1, activa Olla de la Extravagancia; como COSTE destierra boca abajo AL</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">AZAR exactamente 3 o 6 cartas del Extra. No elijas blancos a conveniencia.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  FUSIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si su efecto resuelve, roba 1 carta por 3 desterradas: 1 si elegiste 3 o 2 si elegiste 6. La decisión</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no asegura que permanezca una Fusión/Xyz concreta en Extra.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Desde esa resolución y por todo lo restante del turno, ya no puedes ROBAR cartas por otros efectos. El</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">siguiente robo normal de una Draw Phase posterior no está prohibido por esta frase.</text><path d="M 537 670 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Tu Rocket puede Invocarse Normalmente después y buscar Blaze Accelerator Reload si queda en Deck/GY;</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">buscar una carta específica NO es «robar una carta».</text><path d="M 537 814 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si Reload llega a estar boca arriba, su efecto que envía Volcanic de mano al GY para ROBAR una carta</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">queda incompatible con la prohibición de robo de Extravagancia durante ese mismo turno.</text><path d="M 537 958 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si pretendes Extra concreto para un cierre, recuerda que 3 o 6 cartas fueron desterradas aleatoriamente</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">y podrían incluir la pieza necesaria; comprueba disponibilidad tras pagar.</text><path d="M 537 1102 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1121 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1134" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1163" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 07  /  ACTIVACIÓN</text><text x="74" y="1193" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">7. Cuando cambie el turno, la prohibición de robar por efecto de Extravagancia cesa. Una Reload ya</text><text x="74" y="1216" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activada puede continuar su ciclo en ventana posterior normal si tiene recurso.</text><path d="M 537 1246 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1266 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1280" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1309" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1339" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Plan real de Extravagancia: 1–2 robos iniciales con coste aleatorio de Extra y posteriores búsquedas</text><text x="74" y="1362" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permitidas, sin más robos por efectos este turno.</text><rect x="45" y="1410" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1439" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1469" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No puede activarse después de otras acciones de Main Phase1; con menos de 3 cartas en Extra no hay coste</text><text x="74" y="1492" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">válido; si se intenta Reload para robar después de resolver Extravagancia, no se puede ejecutar el efecto</text><text x="74" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de robo.</text><text x="48" y="1577" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1600" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
