<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual I-E | TROOPER + BONFIRE/FIRE EJECTION"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  I-E  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">I-E | TROOPER + BONFIRE/FIRE EJECTION</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Volcanic con Bonfire en mano, Volcanic Trooper Nivel3 en Deck, Invocación Normal libre; opcional Fire</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Ejection también en mano y al menos un Pyro en Deck.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Activa Bonfire para añadir un monstruo Piro Nivel4 o inferior de Deck a mano: Volcanic Trooper Nivel3</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">es legal.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Invoca Normalmente Trooper; si resuelve su disparador, añade una carta «Volcanic» distinta de Trooper</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Deck. Es una búsqueda, NO coloca una Trampa ni activa Fire Ejection.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Si Fire Ejection ya estaba en mano por sí misma, actívala como Mágica Normal por separado; manda UN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Piro del Deck al GY por EFECTO.</text><path d="M 537 670 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si ese Piro es «Volcanic», elige entre daño igual a su Nivel ×100 o Invocar Bomb Token al campo rival</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(si hay zona libre). No obtienes AMBOS premios.</text><path d="M 537 814 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  BÚSQUEDA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Bonfire NO busca Fire Ejection: busca monstruos Piro; Trooper NO busca Fire Ejection porque no contiene</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">«Volcanic» en su nombre.</text><path d="M 537 958 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Enviar Scattershot mediante Fire Ejection NO cuenta como enviarlo por un efecto «Blaze Accelerator»; no</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">declares limpieza masiva por una carta incorrecta.</text><path d="M 537 1102 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Bonfire→Trooper→búsqueda de una carta «Volcanic». Fire Ejection, si ya está en mano, aporta envío de Piro</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">y una de dos recompensas.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Normal libre, Bonfire solo entrega Trooper a mano. Si Ejection no está en mano, no forma parte de una</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">línea de una carta. Sin Piro en Deck, no activa su efecto.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
