<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1630" role="img" aria-label="Guía visual Trooper -&gt; Emission / Inferno; no Reload"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  VOL-R09  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Trooper -&gt; Emission / Inferno; no Reload</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Volcanic: Volcanic Trooper Nivel3 en mano, Normal libre, Volcanic Emission e Inferno presentes en Deck; al</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">menos una zona de M/T libre; no hay permiso especial para activar Trampa recién colocada.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente Volcanic Trooper. Al ser Invocado puede añadir 1 carta «Volcanic» del Deck salvo</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">otro Trooper.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si eliges Volcanic Emission, pasa del Deck a tu MANO: no entra automáticamente al campo, y no se activa</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como Trampa inmediatamente.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Si eliges Volcanic Inferno, también entra a MANO y es Trampa CONTINUA: tras colocarla espera a una</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ventana legal posterior.</text><path d="M 537 670 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Trooper tiene otro efecto opcional: descarta 1 carta de mano para Invocar un Bomb Token a la zona del</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rival, si hay zona legal; su controlador pierde 500 LP cuando el Token es destruido.</text><path d="M 537 814 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Solo si Emission estaba previamente colocada y puede activarse en una ventana legal, una opción permite</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">tomar un Volcanic de Deck y añadirlo a mano O Invocarlo ignorando condiciones, con devolución a mano al</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">End Phase.</text><path d="M 537 981 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  ACTIVACIÓN</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Solo si Inferno está activada boca arriba y el oponente activa un efecto de monstruo en CAMPO, puede</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desterrar 1 Piro del GY para infligir 500 y, si fue Volcanic, negar el efecto. Requiere la carta Piro en</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">GY antes de activar.</text><path d="M 537 1148 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1167 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1180" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1209" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 07  /  BÚSQUEDA</text><text x="74" y="1239" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">7. Blaze Accelerator Reload NO es buscable por el efecto de Trooper: no contiene «Volcanic» en su nombre.</text><text x="74" y="1262" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Rocket sí puede buscar Reload por su nombre Blaze Accelerator.</text><path d="M 537 1292 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1312 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1326" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1355" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1385" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con 1 Trooper real puedes buscar Emission o Inferno (solo una por Invocación) y programar la Trampa para</text><text x="74" y="1408" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno posterior; token solo con descarte real.</text><rect x="45" y="1456" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1485" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si ambas Trampas están agotadas o Trooper es negado, no hay búsqueda. Las Trampas recién colocadas no se</text><text x="74" y="1538" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activan normalmente ese turno. No hay Piro del GY para coste Inferno sin prepararlo.</text><text x="48" y="1600" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1623" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
