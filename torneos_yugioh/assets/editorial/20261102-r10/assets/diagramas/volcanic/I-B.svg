<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual I-B | SCATTERSHOT Y LIMPIEZA"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#702b2e" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#ee8a4e"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">VOLCANIC  ·  I-B  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">I-B | SCATTERSHOT Y LIMPIEZA</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Campo: Blaze Accelerator Reload boca arriba desde turno anterior; mano: 1 Scattershot; Deck/mano: otras</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">DOS Scattershot disponibles; Main Phase.</text><path d="M 537 238 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Durante Main Phase activa Reload boca arriba. Al resolver, ENVÍA 1 Volcanic Scattershot de la mano al</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">GY por EFECTO; después roba 1 carta.</text><path d="M 537 382 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  DESTRUCCIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Scattershot fue enviada por un efecto Blaze Accelerator: al concluir esa cadena, dispone de efecto de</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">500 daño y de efecto de destrucción masiva, si los disparadores siguen legales.</text><path d="M 537 526 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa su efecto de limpieza: ENVÍA las otras DOS Scattershot desde mano/Deck al GY como COSTE de</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activación; NO es una exigencia de que ambas hayan comenzado en la mano.</text><path d="M 537 670 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  DESTRUCCIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si la limpieza resuelve, destruye todos los monstruos que el rival controle y sean realmente</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destruibles por este efecto. No afecta tus propios monstruos.</text><path d="M 537 814 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Las tres Scattershot, al ser enviadas al GY, generan cada una un disparador de 500 daño aplicable en</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">cadenas apropiadas; el total potencial es 1500 LP si los tres efectos resuelven sin negación.</text><path d="M 537 958 v 29" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Distingue el orden: los dos envíos por COSTE ocurren antes de las respuestas a limpieza; el daño de</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">esas dos Scattershot se dispone tras resolver la cadena donde se enviaron.</text><path d="M 537 1102 v 30" stroke="#ee8a4e" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#ee8a4e" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Una Reload activa puede convertir tres Scattershot reales en destrucción de monstruos rivales + hasta 1500</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">daño total; requiere las 3 copias disponibles en lugares legales.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si no quedan dos Scattershot en mano/Deck, no activar limpieza; si Reload es negada no se envía la</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">primera; si el rival tiene protección a destrucción no se elimina; el daño depende de resoluciones reales.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
