<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1296" role="img" aria-label="Guía visual Control de cementerio sin gastar Theosis"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-R08  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Control de cementerio sin gastar Theosis</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Birth Mágica Continua boca arriba; controlas al menos un Kashtira (Fenrir); adversario tiene 3 cartas</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">seleccionables en GY y activa el efecto de una Mágica.</text><path d="M 537 238 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Conserva Nacimiento Kashtira (Birth) boca arriba; no necesitas gastar Kashtiratheosis para esta</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">interacción defensiva.</text><path d="M 537 382 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al activar el adversario una carta Mágica o su efecto, comprueba que controlas un monstruo Kashtira y</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">que el rival tiene TRES cartas válidas en su GY.</text><path d="M 537 526 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  CEMENTERIO</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa el efecto propio de Nacimiento: SELECCIONA exactamente 3 cartas en el Cementerio adversario. No</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">permite elegir solo una o dos.</text><path d="M 537 670 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  DESTIERRO</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si se resuelve con los tres objetivos todavía válidos, destierra las 3 cartas rivales BOCA ABAJO; no</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">afecta cartas en mano, campo o Deck.</text><path d="M 537 814 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTIERRO</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. No prometas una negación de Mágica: Birth destierra recursos del Cementerio, NO niega esa activación.</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si rival mueve objetivos antes de resolver, reevaluar según el estado real.</text><path d="M 537 958 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Interrupción de Cementerio mediante Birth sin consumir Kashtiratheosis. Tres objetivos desterrados boca</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">abajo, si se cumplen requisitos y resuelve.</text><rect x="45" y="1122" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Kashtira propio en campo o sin tres objetivos GY no se activa; si hay efectos que protegen o trasladan</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">los objetivos, comprobar qué queda al resolver.</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
