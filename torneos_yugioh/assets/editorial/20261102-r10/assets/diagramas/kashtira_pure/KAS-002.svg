<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual KAS-002 | Fenrir con segunda amenaza"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-002  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">KAS-002 | Fenrir con segunda amenaza</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Kashtira Fenrir + Kashtiratheosis; propio campo vacío. Deck: Kashtira Riseheart y Kashtira Unicorn.</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Extra: Kashtira Shangri-Ira; los efectos no están negados.</text><path d="M 537 238 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Fenrir desde mano porque no controlas monstruos. Fenrir es EARTH / Nivel 7.</text><path d="M 537 359 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En tu Main Phase, activa Fenrir para añadir Kashtira Riseheart desde el Deck a la mano; NO lo Invocas</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">por esta búsqueda.</text><path d="M 537 503 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa Kashtiratheosis y selecciona al Fenrir boca arriba; Invoca desde Deck en Defensa a Kashtira</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Unicorn, WIND / Nivel 7, de Atributo distinto.</text><path d="M 537 647 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si deseas terminar con Xyz, superpone exactamente Fenrir + Unicorn (dos Nivel 7) para Kashtira</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Shangri-Ira del Extra. La restricción de Theosis permite Xyz, pero no otras Invocaciones del Extra ese</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno.</text><path d="M 537 814 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTIERRO</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Anota el intercambio: Shangri-Ira permanece; Fenrir deja de ser monstruo boca arriba y no puede</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ejecutar después su destierro desde el campo. Riseheart queda en mano.</text><path d="M 537 958 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con los efectos sin interrupción: Kashtira Shangri-Ira (2 materiales) en campo y Riseheart en mano. Sin</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">atribuirle a Fenrir una segunda Invocación por campo vacío.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Kashtiratheosis en mano, la búsqueda de Fenrir NO equivale a poner otro Nivel 7 en campo. Si niegan</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Theosis, no existe el segundo material. Si ambos monstruos siguen, también puedes conservarlos como</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">amenazas separadas.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
