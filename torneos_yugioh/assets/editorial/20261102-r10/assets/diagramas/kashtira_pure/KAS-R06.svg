<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual Birth rescata una mano con dos Kashtira grandes"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-R06  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Birth rescata una mano con dos Kashtira grandes</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Fenrir, Unicornio y Nacimiento Kashtira (Birth). Tu campo vacío, Invocación Normal disponible;</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Extra: Shangri-Ira.</text><path d="M 537 238 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Con campo de monstruos propio vacío, Invoca Especialmente Fenrir Nivel7 desde mano, usando su</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">condición. No gastaste Invocación Normal.</text><path d="M 537 382 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Nacimiento Kashtira desde mano como Mágica Continua; su efecto continuo permite Invocar de modo</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">NORMAL monstruos Nivel7 sin Sacrificar.</text><path d="M 537 526 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Invoca NORMALMENTE Kashtira Unicornio Nivel7 sin sacrificios; consumes la Invocación Normal de este</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno, pero no necesitas dos sacrificios.</text><path d="M 537 670 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. En tu Main Phase, superpón Fenrir + Unicornio Nivel7: Invocación Xyz Kashtira Shangri-Ira Rango7 con</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">dos materiales reales.</text><path d="M 537 814 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  XYZ</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Nacimiento sigue boca arriba. Si tiene otro efecto utilizable más adelante (revivir Kashtira no-Xyz</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desterrado o en GY), verifica antes que exista recurso real: no aparece uno automáticamente por esta</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">línea.</text><path d="M 537 981 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 1001 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="1015" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1044" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nacimiento convierte dos grandes Kashtira en 2 materiales Nivel7 disponibles para Shangri-Ira, sin gastar</text><text x="74" y="1097" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">sacrificios. Normal se usó sobre Unicornio.</text><rect x="45" y="1145" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1174" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Birth activo debes tributar para Normal de Nivel7; si Fenrir no cumple campo vacío o falla su</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocación, queda solo Unicornio; sin Normal disponible, no hay segundo cuerpo.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
