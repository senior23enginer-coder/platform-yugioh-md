<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1342" role="img" aria-label="Guía visual KAS-003 | Riseheart y destierro útil"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-003  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">KAS-003 | Riseheart y destierro útil</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tu turno/Main Phase: Fenrir Nivel7 boca arriba y Riseheart Nivel4 en mano; otro Kashtira distinto de</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Riseheart disponible en Deck para desterrar; Extra: Shangri-Ira Rango7.</text><path d="M 537 238 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Con Fenrir en campo, activa desde mano la autoInvocación de Kashtira Riseheart. Cuando resuelve,</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Riseheart Nivel4 entra en campo y restringe las Invocaciones del Extra a SOLO monstruos Xyz el resto del</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno.</text><path d="M 537 405 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  DESTIERRO</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Durante esta Main Phase, activa el otro efecto de Riseheart (si aún no lo utilizaste): DESTIERRA como</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">COSTE 1 carta Kashtira distinta de Riseheart desde tu Deck. No es una búsqueda a mano.</text><path d="M 537 549 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  DESTIERRO</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Al resolver, destierra boca abajo las tres cartas superiores del Deck rival, si existen. Si destierras</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">alguna, Riseheart pasa de Nivel4 a Nivel7.</text><path d="M 537 693 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. SOLO tras confirmar Riseheart Nivel7, puedes superponerlo con Fenrir Nivel7 e Invocar Xyz Kashtira</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Shangri-Ira Rango7 del Extra registrado; conserva dos materiales si no se ha consumido ninguno.</text><path d="M 537 837 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTIERRO</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. No atribuyas el destierro boca abajo al efecto de Shangri-Ira, ni afirmes conocer las cartas del Deck</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rival desterradas boca abajo.</text><path d="M 537 981 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 1001 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="1015" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1044" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Fenrir y Riseheart permiten una Invocación Xyz Rango7 cuando el destierro de Riseheart se resuelve con</text><text x="74" y="1097" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">éxito; Shangri-Ira con 2 materiales. El resto del turno sigue restringido a Xyz del Extra.</text><rect x="45" y="1145" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1174" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si se niega Riseheart, no resuelve su nivel; si falta carta Kashtira desterrable del Deck, no puedes</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activar el segundo efecto; si no se destierra carta del Deck rival, no alcanza Nivel7; si falta Fenrir ya</text><text x="74" y="1250" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no hay 2 Nivel7.</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1335" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
