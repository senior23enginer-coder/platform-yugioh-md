<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1273" role="img" aria-label="Guía visual KAS-001 | Unicornio y Theosis"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-001  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">KAS-001 | Unicornio y Theosis</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Unicornio y Theosis en mano; campo propio sin monstruos; objetivo Kashtira distinto y legal en Deck;</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efectos disponibles.</text><path d="M 537 238 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocar Especialmente Unicornio mediante su condición si el campo está vacío.</text><path d="M 537 359 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Resolver su efecto de búsqueda, si procede; escoger la carta que realmente falta y no un duplicado</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">inoperante.</text><path d="M 537 503 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Activar Theosis seleccionando Unicornio y comprobar el atributo distinto del Kashtira que se traerá.</text><path d="M 537 624 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 643 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="656" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="685" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  XYZ</text><text x="74" y="715" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tras resolver, constatar la restricción de Extra a Xyz y el Nivel de cada monstruo en campo.</text><path d="M 537 745 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 764 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="777" width="984" height="155" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="806" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="836" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Solo si hay dos Nivel 7 legales, Invocar un Xyz Rango 7 apropiado; conservar recursos no consumidos.</text><text x="74" y="859" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Resultado condicionado: Dos cuerpos Kashtira y posible Xyz, dependiendo de atributo, selección, efectos y</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">carta del Deck. Si te interrumpen: Si se niega Unicornio pero sigue en campo, Theosis puede seguir siendo</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">viable; si el objetivo deja el campo, revisar si la resolución de Theosis es posible.</text><path d="M 537 935 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 955 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="969" width="984" height="86" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="998" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1028" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dos cuerpos Kashtira y posible Xyz, dependiendo de atributo, selección, efectos y carta del Deck.</text><rect x="45" y="1076" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1105" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1135" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si se niega Unicornio pero sigue en campo, Theosis puede seguir siendo viable; si el objetivo deja el</text><text x="74" y="1158" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">campo, revisar si la resolución de Theosis es posible. PRUEBA DE REGLAS: Elegir un Kashtira de Nivel 7</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">distinto atributo realmente disponible para hacer Xyz; no asumir que Riseheart Nivel 4 produce Rango 7.</text><text x="48" y="1243" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
