<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1273" role="img" aria-label="Guía visual KAS-004 | Ruta de ruptura con Big Eye"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-004  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">KAS-004 | Ruta de ruptura con Big Eye</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Campo propio: DOS monstruos de Nivel7 utilizables. Rival: al menos 1 monstruo al que se le pueda</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">seleccionar. Extra: Number 11: Big Eye; tu Main Phase.</text><path d="M 537 238 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  XYZ</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Confirma niveles actuales: exactamente dos monstruos de Nivel7 pueden utilizarse como materiales Xyz,</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no cartas en mano ni monstruos de otros niveles.</text><path d="M 537 382 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Superpón ambos Nivel7 e Invoca Xyz Número 11: Ojo Grande (Big Eye) Rango7 desde el Extra registrado.</text><path d="M 537 503 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. En tu Main Phase, activa Big Eye: separa 1 de sus materiales como COSTE y selecciona 1 monstruo del</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">rival al que legalmente puedas hacer objetivo.</text><path d="M 537 647 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Al resolver sin negación ni pérdida del objetivo, toma CONTROL del monstruo objetivo. Big Eye NO puede</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">atacar durante el turno en que activó este efecto.</text><path d="M 537 791 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Calcula ataques solo de otros monstruos que efectivamente puedan atacar; no atribuyas el ataque 2600 de</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Big Eye al daño de ese turno.</text><path d="M 537 935 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 955 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="969" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="998" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1028" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Big Eye Rango7 con 1 material remanente + monstruo rival controlado por ti; Big Eye no puede atacar ese</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno. No se destruye ni se destierra el objetivo por este efecto.</text><rect x="45" y="1099" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1128" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1158" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si el objetivo es ilegal o deja el campo antes de resolver, no cambias su control; ya se separó el</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">material como coste. El monstruo apropiado debe estar presente y ser seleccionable.</text><text x="48" y="1243" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
