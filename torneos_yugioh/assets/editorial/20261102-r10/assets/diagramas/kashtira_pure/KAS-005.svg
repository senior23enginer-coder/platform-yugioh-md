<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1532" role="img" aria-label="Guía visual KAS-005 | Reinicio mediante Zeus"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#2e2a63" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#8878f0"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">KASHTIRA PURE  ·  KAS-005  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">KAS-005 | Reinicio mediante Zeus</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Turno propio: Number 11: Big Eye XYZ con 2 materiales propios (ya está en campo), no se activó su efecto</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de tomar control; Battle Phase disponible, ZEUS en Extra; rival presenta monstruo contra el que Big Eye</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">pueda batallar y sobrevivir.</text><path d="M 537 261 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  XYZ</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Usa Big Eye u otro XYZ que controles en una batalla REAL durante tu Battle Phase; Big Eye no debe haber</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">activado su efecto que le impide atacar este turno. Debe haber BATALLADO un XYZ, no basta declarar que</text><text x="74" y="398" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">estuvo en campo.</text><path d="M 537 428 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 447 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="460" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="489" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Mantén un XYZ bajo tu control tras la batalla; pasa a Main Phase 2. No puedes Invocar Xyz Zeus en</text><text x="74" y="542" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Battle Phase por simple intención.</text><path d="M 537 572 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 591 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="604" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="633" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Como un XYZ batalló este turno, Invoca Xyz Divine Arsenal AA-ZEUS desde Extra usando UN XYZ propio como</text><text x="74" y="686" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">material; transfiere los materiales que ese XYZ tuviera.</text><path d="M 537 716 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 735 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="748" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="777" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si se utilizó Big Eye con 2 materiales, ZEUS queda con TRES materiales totales: Big Eye + los dos</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">debajo. No confundas sus 3000 ATK con cantidad de materiales.</text><path d="M 537 860 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 879 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="892" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="921" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTRUCCIÓN</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. En ventana de Efecto Rápido, puedes separar 2 materiales como COSTE y, al resolver, ENVIAR al</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cementerio TODAS las demás cartas del CAMPO, incluidas tus propias Birth/monstruos, salvo Zeus; no se</text><text x="74" y="997" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">describe como destrucción.</text><path d="M 537 1027 v 29" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 1046 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="1059" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1088" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  XYZ</text><text x="74" y="1118" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Después de esa activación de ZEUS con 3 materiales, queda 1 material. Si el XYZ usado tenía cero</text><text x="74" y="1141" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales, ZEUS empezaría con solo 1 y no podría activar ese envío inmediatamente.</text><path d="M 537 1171 v 30" stroke="#8878f0" stroke-width="4" fill="none"/><path d="M 528 1191 l 9 10 l 9 -10" stroke="#8878f0" stroke-width="4" fill="none"/><rect x="45" y="1205" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1234" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1264" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Un XYZ que realmente combatió habilita ZEUS por superposición en Main Phase 2; con Big Eye de 2</text><text x="74" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales, ZEUS arranca con 3 y puede pagar una limpieza de 2.</text><rect x="45" y="1335" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1364" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si no hubo batalla de un Xyz este turno, no se habilita el procedimiento alternativo; si la batalla</text><text x="74" y="1417" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destruye tu único Xyz y no queda otro, no lo puedes superponer; no atribuir destrucción ni inmunidad</text><text x="74" y="1440" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ignorada.</text><text x="48" y="1502" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1525" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
