<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 868" role="img" aria-label="Mago Oscuro / Gaia Rush · DM02"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2134"/><stop offset="1" stop-color="#0a1122"/></linearGradient></defs><rect x="0" y="0" width="940" height="868" fill="url(#bg)" rx="18"/><text x="24" y="38" font-size="23" font-weight="800" fill="#f8df8c">Mago Oscuro / Gaia Rush · DM02</text><text x="24" y="70" font-size="15" fill="#7cdded">CONDICIONAL · Guía documental; no certifica legalidad</text><rect x="27" y="108" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="156" r="23" fill="#087a98"/><text x="69" y="163" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">1</text><text x="110" y="135" fill="#e9f9ff" font-size="17">Comprobar que todos los monstruos del Main son Lanzador de Conjuros y los de Nivel 5+</text><text x="110" y="158" fill="#e9f9ff" font-size="17">son de los tres nombres permitidos.</text><path d="M470 207 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="228" width="885" height="96" fill="#122f48" stroke="#e5bd55" rx="12"/><circle cx="69" cy="276" r="23" fill="#087a98"/><text x="69" y="283" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">2</text><text x="110" y="255" fill="#e9f9ff" font-size="17">Estar en turno 2 o posterior; Skill aún no usada este Duelo.</text><path d="M470 327 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="348" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="396" r="23" fill="#087a98"/><text x="69" y="403" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">3</text><text x="110" y="375" fill="#e9f9ff" font-size="17">Revelar de la mano Mago Oscuro, Chica Maga Oscura o Hechicero Eliminador Oscuro (Nivel</text><text x="110" y="398" fill="#e9f9ff" font-size="17">5+).</text><path d="M470 447 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="468" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="516" r="23" fill="#087a98"/><text x="69" y="523" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">4</text><text x="110" y="495" fill="#e9f9ff" font-size="17">Excavar exactamente las tres cartas superiores del Deck; si entre ellas hay Mágica,</text><text x="110" y="518" fill="#e9f9ff" font-size="17">puedes añadir una a mano.</text><path d="M470 567 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="588" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="636" r="23" fill="#087a98"/><text x="69" y="643" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">5</text><text x="110" y="615" fill="#e9f9ff" font-size="17">Mandar todas las otras cartas excavadas al Cementerio.</text><path d="M470 687 v13 m-6 -6 l6 7 6 -7" fill="none" stroke="#53cbdd" stroke-width="3"/><rect x="27" y="708" width="885" height="96" fill="#122f48" stroke="#375c78" rx="12"/><circle cx="69" cy="756" r="23" fill="#087a98"/><text x="69" y="763" text-anchor="middle" fill="#fff" font-weight="800" font-size="23">6</text><text x="110" y="735" fill="#e9f9ff" font-size="17">Opcionalmente mandar un Mago Oscuro del Deck al Cementerio, si todavía está allí.</text></svg>