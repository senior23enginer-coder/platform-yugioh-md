<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1440" role="img" aria-label="Guía visual Tinia sola -&gt; Bienvenidos -&gt; Regina -&gt; Strelitzia"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  ELF-R07  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Tinia sola -&gt; Bienvenidos -&gt; Regina -&gt; Strelitzia</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Elfnote Tinia. Centro libre. Deck: Elfnotes: Welcome Home, Regina Nivel6 y Power Patron Cantante</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel1. Extra: Strelitzia Nivel7.</text><path d="M 537 238 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Tinia al centro desde mano; al usar su efecto de Main Phase coloca BOCA ARRIBA</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">desde Deck la Mágica Continua Elfnotes: Welcome Home.</text><path d="M 537 382 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Welcome Home; ENVÍA Tinia WATER del campo al GY como COSTE. Cuando resuelva, Invoca Regina WIND</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">del Deck en Defensa al centro (distinto Atributo) y aplica el bloqueo Extra solo Sincronía.</text><path d="M 537 526 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Regina entró al centro: Invoca Power Patron Cantante Nivel1 desde Deck a lateral. Regina es Hechicera</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel6 no Cantante.</text><path d="M 537 670 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Para Strelitzia Nivel7, NO uses el Efecto Rápido de Power Patron que subiría 3 niveles a Regina. Sin</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">modificar niveles, Invoca por Sincronía Strelitzia usando Power Patron1 + Regina6 = 7.</text><path d="M 537 814 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Coloca Strelitzia en el centro si está libre tras usar materiales. Tiene ATK original 3000 SOLO</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mientras está en el centro; fuera del centro su ATK original es «?» sujeto a reglas de valor.</text><path d="M 537 958 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  BÚSQUEDA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Como Regina y Patron se enviaron por ser materiales de Synchro, sus disparadores pueden recuperar</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Regina y buscar Elfnote en cadena nueva si no usados.</text><path d="M 537 1102 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Con Tinia inicial y recursos reales de Deck, la variante STRELITZIA produce Sincronía Nivel7 por 1+6, sin</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">subir el Nivel mediante Power Patron.</text><rect x="45" y="1266" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Activar el +3 de Power Patron produce nivel9+1=10, no Strelitzia7; sin Tinia/Wel Home/Regina/Patron Deck o</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Strelitzia Extra disponible no hay ruta.</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
