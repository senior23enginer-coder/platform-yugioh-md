<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1319" role="img" aria-label="Guía visual Regina en mano sin centro libre: pagar y elegir"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  ELF-R08  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Regina en mano sin centro libre: pagar y elegir</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Centro propio OCUPADO por otro monstruo; mano: Regina + otra carta Elfnote; zona lateral libre y no hay</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efecto que mueva antes el monstruo central.</text><path d="M 537 238 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Comprueba si necesitas el disparador de Regina que Invoca un segundo Elfnote desde Deck: ese disparador</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">SOLO sucede cuando Regina entra en el CENTRO.</text><path d="M 537 382 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  ACTIVACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Si eliges activarla ahora desde mano, envía otra carta Elfnote de mano/campo boca arriba al GY como</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">COSTE (antes de una posible negación).</text><path d="M 537 526 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Al resolver, Invoca Regina en un espacio lateral libre porque el centro sigue ocupado. Eso es legal,</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">pero NO habilita su segundo efecto de convocar Power Patron desde Deck.</text><path d="M 537 670 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  JUGADA</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Por tanto, no calcules 1-carta -&gt; Power Patron -&gt; June Pride: falta Power Patron y el centro libre.</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Regina sigue Nivel6 en lateral.</text><path d="M 537 814 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  ACTIVACIÓN</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Alternativa conservadora: si necesitas la ruta larga, primero libera el centro por una acción legal</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">independiente y solo entonces activa Regina; no se afirma una manera gratuita de hacerlo con esta mano.</text><path d="M 537 958 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">En presencia de centro ocupado, Regina puede entrar lateral y consumir otra Elfnote sin disparar su</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">extensión; es una decisión táctica negativa documentada.</text><rect x="45" y="1122" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si no existe otra carta Elfnote para pagar coste, ni siquiera puede activar autoInvocación. Si el centro</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">se libera en respuesta antes de resolver, la colocación exacta depende del estado real al resolver; no</text><text x="74" y="1227" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">preasignar central.</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1312" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
