<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1296" role="img" aria-label="Guía visual Tinia reactiva: destierro temporal aleatorio"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  ELF-R09  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">Tinia reactiva: destierro temporal aleatorio</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Turno del adversario: Tinia se encuentra en zona de monstruos PRINCIPAL lateral; otro monstruo propio</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">ocupa centro; rival tiene al menos 1 carta en mano.</text><path d="M 537 238 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  JUGADA</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Tinia tiene un Efecto Rápido que solo puede utilizarse en turno del adversario. Comprueba que Tinia</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">está en una zona lateral y que OTRO monstruo propio está en el centro.</text><path d="M 537 382 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Activa Tinia: durante resolución intercambia la POSICIÓN DE ZONA de Tinia con la del monstruo central,</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">sin Invocarlos ni cambiarles de controlador.</text><path d="M 537 526 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  JUGADA</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Después del intercambio puedes desterrar BOCA ARRIBA 1 carta ALEATORIA de la mano del adversario, hasta</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">la End Phase. No eliges su identidad.</text><path d="M 537 670 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  DESTIERRO</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. En la End Phase, la carta desterrada temporalmente regresa conforme al efecto. No la cuentes como</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">destierro permanente ni como descarte al Cementerio.</text><path d="M 537 814 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  DESTIERRO</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Si uno de los dos monstruos deja su zona antes de resolver, no asegures intercambio o destierro.</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tampoco atribuyas un efecto de búsqueda o Convocación a este Efecto Rápido.</text><path d="M 537 958 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 978 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="992" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1021" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Intercambio de posiciones de zona + exclusión temporal aleatoria de una carta en mano rival hasta End</text><text x="74" y="1074" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Phase.</text><rect x="45" y="1122" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1151" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1181" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tinia está en centro, centro vacío, turno propio, rival sin cartas en mano o interrupción de intercambio:</text><text x="74" y="1204" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no afirmar que la carta aleatoria fue desterrada.</text><text x="48" y="1266" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1289" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
