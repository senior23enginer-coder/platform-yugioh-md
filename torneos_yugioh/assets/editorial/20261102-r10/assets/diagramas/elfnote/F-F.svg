<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1365" role="img" aria-label="Guía visual F-F | JUNORA COMO RESPUESTA"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  F-F  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">F-F | JUNORA COMO RESPUESTA</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Elfnote: Junora the Power Patron of Tuning YA está legalmente en campo tras una Invocación Synchro previa</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">que haya cumplido 1 Cantante + 2 NO Cantantes sumando Nivel10; el rival controla monstruos en columnas</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">compartidas con Elfnote.</text><path d="M 537 261 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Si aún no se ha Invocado Junora, comprueba tres monstruos reales (exactamente un Cantante y dos no</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Cantantes) cuyos Niveles sumen 10; su permiso de tratar un monstruo CENTRAL como Cantante no suprime los</text><text x="74" y="398" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">otros dos requisitos.</text><path d="M 537 428 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 447 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="460" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="489" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Cuando Junora es Invocada Synchro legalmente, puedes activar su disparador para negar efectos de todas</text><text x="74" y="542" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">las cartas boca arriba que controle el rival, salvo una negación que impida resolver.</text><path d="M 537 572 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 591 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="604" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="633" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  ACTIVACIÓN</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Durante cualquier turno, con Junora boca arriba y al menos un Elfnote tuyo, activa su Efecto Rápido si</text><text x="74" y="686" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">deseas impedir materiales del adversario en columnas con los Elfnote propios.</text><path d="M 537 716 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 735 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="748" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="777" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  FUSIÓN</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Al resolver, los monstruos rivales en esas columnas no pueden ser usados como material para Fusión,</text><text x="74" y="830" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Synchro, Xyz o Link hasta acabar el turno. No los destruye, no los destierra, no impide Tributar salvo que</text><text x="74" y="853" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">un texto específico lo haga.</text><path d="M 537 883 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 902 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="915" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="944" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  JUGADA</text><text x="74" y="974" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. El efecto rápido se limita una vez por turno. No se declara como bloqueo global a todas las zonas ni si</text><text x="74" y="997" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Junora no está boca arriba.</text><path d="M 537 1027 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1047 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1061" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1090" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1120" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Junora ya Invocada por Synchro establece negación inicial y, en una ventana posterior, prohíbe usar</text><text x="74" y="1143" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">materiales rivales en columnas compartidas durante ese turno.</text><rect x="45" y="1191" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1220" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1250" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No hay una línea automática demostrada desde una sola carta del Main que cumpla 1 Cantante+2 no Cantantes</text><text x="74" y="1273" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">y total10. Sin Junora en campo no hay respuesta; si el rival usa otra columna, no recibe la restricción.</text><text x="48" y="1335" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1358" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
