<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1463" role="img" aria-label="Guía visual F-B | REGINA AL CENTRO"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  F-B  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">F-B | REGINA AL CENTRO</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Elfnote Regina y OTRA carta Elfnote distinta (por ejemplo, Lucina). Centro de monstruos propio</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">libre. Deck: Power Patron; Extra: June Pride Nivel10.</text><path d="M 537 238 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Durante la Main Phase, activa el Efecto Rápido de Regina DESDE MANO: envía la OTRA carta Elfnote de</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mano o campo boca arriba al GY como COSTE. Regina todavía está en mano mientras el rival puede responder.</text><path d="M 537 382 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Cuando resuelve, Invoca Especialmente Regina a la zona CENTRAL libre (Nivel6, Hechicera, no Cantante).</text><path d="M 537 503 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Por Invocarse al centro, Regina activa su segundo efecto; Invoca Power Patron del Deck a una zona de</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruos lateral libre. Patron es Demonio Cantante Nivel1.</text><path d="M 537 647 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Durante la Main Phase activa el Efecto Rápido de Power Patron: selecciona la Regina central; súbele el</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel6→9 al resolver e INMEDIATAMENTE Invoca por Sincronía June Pride Nivel10 usando Power Patron1 +</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Regina9.</text><path d="M 537 814 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  SINCRONÍA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. June Pride va al centro. En cadena nueva, si están disponibles sus disparadores por ser materiales de</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sincronía, Regina vuelve desde GY a mano y Patrono añade una carta Elfnote del Deck a mano.</text><path d="M 537 958 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  JUGADA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Mientras June Pride siga en centro, considera la restricción de ataques: solo monstruos en centros</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">pueden declarar ataque. No declares que elimina todo ataque del rival.</text><path d="M 537 1102 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1122 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1136" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1165" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Dos cartas de mano (Regina + otro Elfnote) pueden producir June Pride Nivel10 central; se consumió una</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">segunda carta Elfnote como coste, y las recuperaciones posteriores son opcionales.</text><rect x="45" y="1266" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1295" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin la segunda carta Elfnote no puedes pagar coste de Regina; Regina negada no entra; Regina fuera del</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">centro no convoca Power Patron; si Patrono es negado no se ajusta Nivel; el bloqueo de Patrono deja Extra</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">solo Synchro mientras esté activo.</text><text x="48" y="1433" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
