<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1607" role="img" aria-label="Guía visual F-E | STRELITZIA REACTIVA"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  F-E  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">F-E | STRELITZIA REACTIVA</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Turno del rival, SU Main Phase: Elfnote Seraphim Strelitzia Nivel7 ya Invocada por Sincronía en tu zona</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">CENTRAL; tu Cementerio contiene Elfnote Regina Nivel6; una zona de monstruo lateral libre; efecto de</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Strelitzia no usado este turno.</text><path d="M 537 261 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  ACTIVACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. En una ventana legal de Main Phase del rival, activa el Efecto Rápido de Strelitzia; no lo declares en</text><text x="74" y="375" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Battle Phase ni Damage Step.</text><path d="M 537 405 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 424 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="437" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="466" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver, Invoca Especialmente la Regina Nivel6 desde tu GY a una zona principal lateral libre. Solo</text><text x="74" y="519" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">puedes usar un Elfnote Nivel6 o menor de mano o GY, NO del Deck.</text><path d="M 537 549 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 568 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="581" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="610" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Tras Invocar, decide si aplicas la reducción OPCIONAL: todos los monstruos de Nivel4 o mayor en campo</text><text x="74" y="663" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">reducen 3 niveles hasta fin del turno (Strelitzia 7→4, Regina 6→3, y también enemigos elegibles).</text><path d="M 537 693 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 712 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="725" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="754" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Desde la resolución del efecto Strelitzia, el resto de ese turno solo puedes Invocar desde Extra</text><text x="74" y="807" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruos Synchro. No afirmes que puedes crear Xyz/Link como seguimiento.</text><path d="M 537 837 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 856 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="869" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="898" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  INVOCACIÓN</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. La Invocación de Regina no fue al centro; por ello no actives su disparador que requiere haber sido</text><text x="74" y="951" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invocada a la zona central.</text><path d="M 537 981 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1000 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1013" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1042" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  SINCRONÍA</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si la Regina fue enviada al GY como material de la Sincronía inicial, verifica si ya consumió sus</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">efectos correspondientes; no concedas otra búsqueda gratis al reaparecer en lateral.</text><path d="M 537 1125 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1144 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1157" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1186" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 07  /  JUGADA</text><text x="74" y="1216" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">7. La ATK original de Strelitzia es 3000 mientras permanezca en el centro, con independencia de la</text><text x="74" y="1239" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">reducción de Niveles; la reducción no reduce ATK.</text><path d="M 537 1269 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1289 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1303" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1332" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1362" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Interacción real durante Main Phase rival: Strelitzia central + Regina lateral reanimada; reducción global</text><text x="74" y="1385" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de Niveles opcional y bloqueo Extra Synchro posterior.</text><rect x="45" y="1433" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1462" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1492" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Regina u otro Elfnote Nivel6 o menor en mano/GY, zona libre, ventana Main Phase o efecto disponible,</text><text x="74" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">no se produce la Invocación; si el rival niega Strelitzia, no se reducen Niveles ni llega el cuerpo extra.</text><text x="48" y="1577" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1600" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
