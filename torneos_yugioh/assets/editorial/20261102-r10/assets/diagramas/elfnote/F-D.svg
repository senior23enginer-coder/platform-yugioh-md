<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1630" role="img" aria-label="Guía visual F-D | MEDIUS -&gt; POWER PATRON"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  F-D  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">F-D | MEDIUS -&gt; POWER PATRON</text><rect x="45" y="126" width="984" height="132" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Main Phase propia; Medius el Puro Nivel4 en mano, Normal disponible, Elfnote Power Patron Nivel1 en Deck,</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo Nivel6 propio disponible después en la zona central. Extra tiene una Sincronía Elfnote apropiada.</text><text x="74" y="231" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin restricciones conflictivas activadas.</text><path d="M 537 261 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 280 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="293" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="322" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Normalmente a Medius (Hada OSCURIDAD Nivel4) y activa su disparador al ser Invocado.</text><path d="M 537 382 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  INVOCACIÓN</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. Al resolver, elige Invocar Especialmente Elfnote Power Patron (Cantante FUEGO Nivel1) desde Deck; el</text><text x="74" y="496" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">texto también permite añadirlo a mano, pero esa opción NO lo coloca en campo.</text><path d="M 537 526 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 545 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="558" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="587" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Patrono impone una restricción continua mientras está en campo: desde Extra solo Invocaciones Synchro.</text><text x="74" y="640" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">No intentes Link a S:P bajo su presencia.</text><path d="M 537 670 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 689 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="702" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="731" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  ACTIVACIÓN</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Si ya controlas otro monstruo de Nivel6 en zona CENTRAL, activa el efecto rápido del Patrono en Main</text><text x="74" y="784" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Phase: selecciónalo y súbele su Nivel a 9.</text><path d="M 537 814 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 833 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="846" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="875" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  SINCRONÍA</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Inmediatamente después de resolver ese efecto puedes Sincronizar una Elfnote válida de Nivel10 usando</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patrono1 + no-Cantante central9. No declares una Sincronía con solo Medius4 + Patrono1.</text><path d="M 537 958 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  INVOCACIÓN</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Si posteriormente Medius llega al GY, su efecto desde GY permite barajar al Deck un monstruo propio de</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">mano o campo boca arriba y después Invocar Medius; Medius queda desterrado cuando salga del campo. Esta</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">recuperación NO es gratuita ni instantánea en la misma cadena de su búsqueda.</text><path d="M 537 1125 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1144 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1157" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1186" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 07  /  INVOCACIÓN</text><text x="74" y="1216" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">7. Si Medius se Invocó de nuevo en un momento legal y su efecto de Invocación por nombre aún está</text><text x="74" y="1239" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">disponible ese turno, puede buscar/Invocar otro Patrono real del Deck; respeta los límites una vez por</text><text x="74" y="1262" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">turno.</text><path d="M 537 1292 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1312 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1326" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1355" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1385" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Medius trae un Patrono real del Deck; la línea Sincronía requiere además un Nivel6 central y los cambios</text><text x="74" y="1408" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">de Nivel. Medius puede reciclarse desde GY pagando retorno de otro monstruo al Deck.</text><rect x="45" y="1456" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1485" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Sin Patrono Deck o sin Nivel6 central no hay Nivel10; Patrono bloquea Link mientras está en campo; sin</text><text x="74" y="1538" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">monstruo para barajar de mano/campo no revive Medius desde GY.</text><text x="48" y="1600" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1623" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
