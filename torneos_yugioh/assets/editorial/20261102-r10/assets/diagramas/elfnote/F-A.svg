<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1486" role="img" aria-label="Guía visual F-A | LUCINA, BÚSQUEDA Y DESOCUPACIÓN DEL CENTRO"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  F-A  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">F-A | LUCINA, BÚSQUEDA Y DESOCUPACIÓN DEL CENTRO</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: 1 Elfnote Lucina; zona central principal vacía, Normal libre. Deck: Elfnote Regina + Elfnote Power</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron. Extra: Elfnote June Pride Nivel10.</text><path d="M 537 238 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Lucina desde la mano a tu zona principal CENTRAL (Nivel6 Spellcaster). Su</text><text x="74" y="352" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">condición no consume la Invocación Normal.</text><path d="M 537 382 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 401 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="414" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="443" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  BÚSQUEDA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En tu Main Phase, activa Lucina para añadir Elfnote Regina desde Deck a mano; no buscar otra Lucina.</text><path d="M 537 503 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa el Efecto Rápido de Regina en mano: ENVÍA Lucina boca arriba de la zona central al Cementerio</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">como COSTE; luego Invoca Regina desde mano a la zona central, ahora libre.</text><path d="M 537 647 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Regina fue Invocada a la zona central: activa su disparador para Invocar desde Deck Elfnote Power</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron (Cantante Nivel1) a una zona LATERAL; mantén a Regina en el centro.</text><path d="M 537 791 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  SINCRONÍA</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. En Main Phase, activa Power Patron y selecciona Regina del centro: aumenta su Nivel de 6 a 9. Al</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">resolver, acepta la Sincronía inmediata permitida para Elfnote June Pride Nivel10 usando Power Patron</text><text x="74" y="928" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Nivel1 + Regina Nivel9.</text><path d="M 537 958 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 977 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="990" width="984" height="132" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="1019" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  BÚSQUEDA</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. Coloca June Pride en el centro, libre por el uso de Regina. Regina, enviada como material, puede</text><text x="74" y="1072" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">recuperarse a mano; Power Patron, enviado como material, puede buscar 1 carta Elfnote disponible en Deck.</text><text x="74" y="1095" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Ambos son disparadores opcionales sujetos a respuesta.</text><path d="M 537 1125 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1145 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1159" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1188" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1218" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Desde una Lucina: Elfnote June Pride (Synchro Nivel10) en centro; con ambas búsquedas disponibles, Regina</text><text x="74" y="1241" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">vuelve a mano y otra Elfnote entra a mano. No se gastó la Invocación Normal.</text><rect x="45" y="1289" width="984" height="132" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1318" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1348" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Lucina negada: no añade Regina. Regina negada: Lucina ya se pagó como coste y la zona central queda vacía.</text><text x="74" y="1371" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Si no hay Power Patron en Deck o June Pride en Extra, no anunciar la Sincronía. Si Power Patron pierde la</text><text x="74" y="1394" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">posibilidad de seleccionar Regina, el nivel no cambia.</text><text x="48" y="1456" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1479" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
