<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 1417" role="img" aria-label="Guía visual F-C | TINIA Y CONTINUA"><rect width="100%" height="100%" fill="#0e1624" rx="24"/><rect width="100%" height="94" fill="#1d5a69" rx="24"/><rect x="36" y="28" width="9" height="43" rx="4" fill="#55c4ce"/><text x="64" y="43" fill="#b7c8dd" font-size="16" font-weight="bold" font-family="Arial, sans-serif">ELFNOTE  ·  F-C  ·  ESQUEMA DE JUEGO</text><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">F-C | TINIA Y CONTINUA</text><rect x="45" y="126" width="984" height="109" rx="15" fill="#243d5c" stroke="#36465f"/><text x="74" y="155" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">ESTADO INICIAL / CARTAS NECESARIAS</text><text x="74" y="185" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Mano: Elfnote Tinia; centro vacío. Deck: Elfnotes: Welcome Home, Elfnote Regina (WIND) y Power Patron</text><text x="74" y="208" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">(Cantante Nivel1). Extra: Elfnote June Pride Nivel10.</text><path d="M 537 238 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 257 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="270" width="984" height="86" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="299" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 01  /  INVOCACIÓN</text><text x="74" y="329" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">1. Invoca Especialmente Tinia (WATER, Nivel6) desde mano a la zona de monstruos principal CENTRAL.</text><path d="M 537 359 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 378 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="391" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="420" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 02  /  JUGADA</text><text x="74" y="450" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">2. En tu Main Phase, Tinia COLOCA boca arriba Elfnotes: Welcome Home desde Deck: es una MÁGICA CONTINUA</text><text x="74" y="473" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">real, no una Trampa.</text><path d="M 537 503 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 522 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="535" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="564" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 03  /  INVOCACIÓN</text><text x="74" y="594" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">3. Activa Welcome Home: ENVÍA Tinia desde campo al Cementerio como coste; su Atributo original es WATER.</text><text x="74" y="617" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Invoca desde Deck en Defensa a Regina, atributo WIND distinto, colocándola en el centro liberado.</text><path d="M 537 647 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 666 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="679" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="708" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 04  /  INVOCACIÓN</text><text x="74" y="738" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">4. Regina fue Invocada en el centro: su efecto permite Invocar desde Deck Power Patron Nivel1 a una zona</text><text x="74" y="761" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">lateral.</text><path d="M 537 791 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 810 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="823" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="852" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 05  /  SINCRONÍA</text><text x="74" y="882" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">5. Power Patron selecciona a Regina central y aumenta su Nivel6→9. Tras resolver el Efecto Rápido, usa</text><text x="74" y="905" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patrono Cantante Nivel1 + Regina Hechicera Nivel9 para Sincronía inmediata de Elfnote June Pride Nivel10.</text><path d="M 537 935 v 29" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 954 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="967" width="984" height="109" rx="15" fill="#1c2a3e" stroke="#36465f"/><text x="74" y="996" fill="#9cc9f1" font-size="17" font-weight="bold" font-family="Arial, sans-serif">PASO 06  /  BÚSQUEDA</text><text x="74" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">6. June Pride se coloca en el centro. Si los disparadores de materiales no están gastados, Regina puede</text><text x="74" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">regresar a la mano y Patrono puede buscar una carta Elfnote del Deck.</text><path d="M 537 1079 v 30" stroke="#55c4ce" stroke-width="4" fill="none"/><path d="M 528 1099 l 9 10 l 9 -10" stroke="#55c4ce" stroke-width="4" fill="none"/><rect x="45" y="1113" width="984" height="109" rx="15" fill="#17443d" stroke="#36465f"/><text x="74" y="1142" fill="#98e7ce" font-size="17" font-weight="bold" font-family="Arial, sans-serif">META / CAMPO FINAL CONDICIONADO</text><text x="74" y="1172" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Una Tinia inicial puede conducir a June Pride Nivel10 en centro mediante la Continua real Welcome Home,</text><text x="74" y="1195" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Regina y Power Patron. La Normal sigue libre; dos recuperaciones son opcionales.</text><rect x="45" y="1243" width="984" height="109" rx="15" fill="#4b3245" stroke="#36465f"/><text x="74" y="1272" fill="#ffb3b3" font-size="17" font-weight="bold" font-family="Arial, sans-serif">⚠  SI SE INTERRUMPE / CUÁNDO NO FUNCIONA</text><text x="74" y="1302" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Tinia negada antes de colocar Welcome Home; Welcome Home sin Regina de Atributo diferente en Deck; Power</text><text x="74" y="1325" font-family="Arial, sans-serif" font-size="17" fill="#e6edf7">Patron fuera de Deck o June Pride ausente del Extra; zona central ocupada al intentar colocar Regina.</text><text x="48" y="1387" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">IMPORTANTE: secuencia documental y condicionada, no partida simulada. Respetar zonas, costes, ventanas, restricciones</text><text x="48" y="1410" font-family="Arial, sans-serif" font-size="15" fill="#b7c8dd">y disponibilidad de cada carta.</text></svg>
