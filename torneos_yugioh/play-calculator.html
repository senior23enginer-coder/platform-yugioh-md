    <style>
      body {
        margin: 0;
        background: #07101f;
        color: #e4effa;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 1800px;
        margin: auto;
        padding: 20px;
      }
      a {
        color: #83dfee;
      }
      header.offline-nav {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
        align-items: center;
      }
      label {
        font-size: 0.85rem;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      .btn {
        display: inline-block;
        border: 1px solid #32708b;
        border-radius: 8px;
        padding: 10px 14px;
        color: #b6edfa;
        background: #10283c;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary,
      .btn-info {
        background: #087b9d;
        color: white;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .form-control,
      .form-select {
        display: block;
        padding: 10px;
        width: 100%;
        background: #071323;
        color: #e4effa;
        border: 1px solid #2b4c64;
        border-radius: 7px;
      }
      .btn-outline-danger {
        color: #ffc7ce;
        border-color: #b26077;
      }
      .learn-kicker {
        font-size: 0.8rem;
        color: #7bdded;
      }
      .offline-nav select {
        max-width: 400px;
      }
      #offline-status {
        color: #a3cad9;
        font-size: 0.85rem;
        line-height: 1.7;
      }
      @media (max-width: 650px) {
        main {
          padding: 12px;
        }
        header.offline-nav {
          display: block;
        }
        .offline-nav label {
          display: block;
          margin-top: 14px;
        }
      }
    </style>
