name: One-time cleanup of merged Station X working branches
on:
  push:
    branches: [base]
    paths:
      - .github/workflows/cleanup-merged-branches-20261123.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only explicitly known secondary branches
        uses: actions/github-script@v7
        with:
          script: |
            const names=["feat/gpt-authoritative-four-deck-surfaces-20261123"];
            const protectedNames=new Set(['base','main','develop','test']);
            const {owner,repo}=context.repo;
            for (const branch of names) {
              if (protectedNames.has(branch)) throw new Error('Protected principal branch');
              const info=await github.rest.repos.getBranch({owner,repo,branch});
              if (info.data.protected) throw new Error('Protected remote branch: '+branch);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
              core.info('Deleted approved merged/obsolete branch: '+branch);
            }
