name: Temporary hexagonal formatting recovery
on:
  push:
    branches: [refactor/hexagonal-rules-settings-validation]
    paths:
      - '.github/workflows/hexagonal-format-recovery-temporary.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/refactor/hexagonal-rules-settings-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply official architecture formatter and verify
        run: |
          npm run format:architecture
          npm run format:architecture:check
          git diff --stat
      - name: Commit only formatted tracked architecture files on review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --name-only -z | python3 -c 'import sys; paths=sys.stdin.buffer.read().split(b"\0"); assert all(not p or p.startswith(b"torneos_yugioh/") and p.endswith((b".php",b".js",b".css")) for p in paths)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add -u -- torneos_yugioh/
          git commit -m 'style: apply official architecture formatter'
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/refactor/hexagonal-rules-settings-validation
