name: Consolidated migration formatter
on:
  pull_request:
    branches: [base]
    paths:
      - '.github/workflows/consolidated-migration-formatter.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Emit official formatting and verify isolated contracts
        run: |
          npm run format:architecture
          git diff --name-only
          git diff -- torneos_yugioh/src/Application/Presentation torneos_yugioh/assets/source/javascript/shared torneos_yugioh/tests/source_architecture_test.php
          npm run build
          php torneos_yugioh/tests/source_architecture_test.php
          npm run test:navigation
