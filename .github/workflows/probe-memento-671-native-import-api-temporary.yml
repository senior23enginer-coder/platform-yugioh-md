name: Probe Station X native Memento 671 import API (read-only)
on:
  push:
    branches:
      - ops/memento-671-native-api-probe-20261123
    paths:
      - .github/workflows/probe-memento-671-native-import-api-temporary.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Request public native status and check for a valid same-session CSRF
        shell: bash
        run: |
          set -euo pipefail
          cookie="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$cookie" "$body"' EXIT
          url="https://stationxtulua.com/yugioh/?api=deck_data&deck_id=671&op=status"
          code="$(curl --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 --cookie "$cookie" --cookie-jar "$cookie" --output "$body" --write-out '%{http_code}' "$url")"
          python - "$body" "$code" <<'PY'
          import json,sys
          filename,code=sys.argv[1:]
          with open(filename,'rb') as f: payload=f.read()
          print('API_HTTP_STATUS',code,'RESPONSE_BYTES',len(payload))
          if code!='200': raise SystemExit('Native API is not accessible (non-200 status).')
          data=json.loads(payload)
          if data.get('ok') is not True: raise SystemExit('Native API returned ok=false')
          token=data.get('token')
          if not isinstance(token,str) or len(token)<16: raise SystemExit('No authenticated same-session CSRF token returned')
          print(json.dumps({
            'native_api_status':'REACHABLE',
            'deck_id':671,
            'has_data':data.get('has_data'),
            'cards':data.get('cards'),
            'routes':data.get('routes'),
            'last_import':data.get('updated_at'),
            'csrf_provided':True,
            'commit_attempted':False,
          },ensure_ascii=False))
          PY
