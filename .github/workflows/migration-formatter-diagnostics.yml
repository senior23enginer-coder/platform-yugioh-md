name: Migration formatter diagnostics
on:
  pull_request:
    branches: [base]
    paths:
      - '.github/workflows/migration-formatter-diagnostics.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Emit official formatting changes
        run: |
          npm run format:architecture
          git diff --name-only
          git diff -- torneos_yugioh/src/Application/Presentation torneos_yugioh/src/Application/Bootstrap torneos_yugioh/tests/source_architecture_test.php
