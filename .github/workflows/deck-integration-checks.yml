name: Validate deck ZIP integration

on:
  pull_request:
    branches: [base]
    paths:
      - 'torneos_yugioh/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/deck-integration-checks.yml'
      - '!torneos_yugioh/context/**'
  push:
    branches: [base]
    paths:
      - 'torneos_yugioh/includes/decks/data-package.php'
      - 'torneos_yugioh/includes/decks/analysis-progress.php'
      - 'torneos_yugioh/tests/deck_analysis_progress_test.php'
      - 'torneos_yugioh/assets/modules/deck-guide/curated-study.js'
      - 'torneos_yugioh/tests/deck_data_test.php'
      - 'torneos_yugioh/tests/study_presentation_ui_test.cjs'
      - 'torneos_yugioh/assets/editorial/a01-a10-task-manifest.json'
      - 'scripts/deck-analysis-ledger*.cjs'
      - '.github/workflows/deck-integration-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deck-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, pdo_sqlite
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build runtime frontend exactly as deployment
        run: npm run build
      - name: Run complete local native regression suite (M01 acceptance gate)
        run: npm test
      - name: Verify all 40 preserved Memento/Crystron historical regression files
        run: node scripts/deck-legacy-regression-gate.cjs --run
      - name: Verify PHP requirements
        run: |
          php -v
          php -r 'if (!class_exists("ZipArchive") || !extension_loaded("mbstring")) { throw new RuntimeException("ZIP/mbstring unavailable"); }'
      - name: Validate ZIP import and historical combos
        run: |
          php torneos_yugioh/tests/legacy_function_contract_test.php
          php torneos_yugioh/tests/deck_template_test.php
          php torneos_yugioh/tests/calculator_import_test.php
          php torneos_yugioh/tests/deck_data_test.php

          node torneos_yugioh/tests/documented_combo_test.cjs
          node torneos_yugioh/tests/combo_source_test.cjs
          node torneos_yugioh/tests/combo_creator_regression_test.cjs
      - name: Import actual GPT Memento and Crystron ZIP folders in isolated PHP tests
        run: |
          PROMPTS_REPO=https://github.com/senior23enginer-coder/gpt-yugioh-promps-platform.git
          PROMPTS_BRANCH=${GITHUB_HEAD_REF:-base}
          if [ "$PROMPTS_BRANCH" = "fix/a01-public-guide-quality-20261123" ]; then
            git clone --depth 1 --branch base "$PROMPTS_REPO" /tmp/station-x-gpt-decks
            git -C /tmp/station-x-gpt-decks fetch --depth 1 origin 62c0a4a3827ed5efb37a5dfd0c7320e9d4604e92
            git -C /tmp/station-x-gpt-decks checkout --detach 62c0a4a3827ed5efb37a5dfd0c7320e9d4604e92
          elif git ls-remote --exit-code --heads "$PROMPTS_REPO" "refs/heads/$PROMPTS_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$PROMPTS_BRANCH" "$PROMPTS_REPO" /tmp/station-x-gpt-decks
          else
            git clone --depth 1 --branch base "$PROMPTS_REPO" /tmp/station-x-gpt-decks
          fi
          php torneos_yugioh/tests/gpt_real_folder_import_test.php /tmp/station-x-gpt-decks
          node torneos_yugioh/tests/gpt_real_endboard_renderer_test.cjs /tmp/station-x-gpt-decks
          node scripts/deck-analysis-ledger-test.cjs /tmp/station-x-gpt-decks/02_PROMPT_PARA_CODEX/contrato_tareas_a01_a10.json
          node scripts/deck-paper-parity.cjs /tmp/station-x-gpt-decks/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-legacy-paper-cases.json
          node scripts/deck-legacy-route-trace-test.cjs /tmp/station-x-gpt-decks/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-memento-route-traces.json
          node scripts/deck-declarative-route-parity.cjs /tmp/station-x-gpt-decks/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-memento-c01-physical-route.json
          node scripts/run-p06-golden-routes.cjs /tmp/station-x-gpt-decks/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-memento-golden-route-states.json
          node scripts/check-p06-legacy-assertions.cjs /tmp/station-x-gpt-decks/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-protected-legacy-assertions.json
      - name: Enforce two-deck A01-A10 structure and prompt/runtime parity
        run: node scripts/verify-pilot-decks.cjs --prompts-root=/tmp/station-x-gpt-decks
      - name: Validate calculator contracts and rules
        run: |
          node scripts/test-calculator-general.cjs
          node torneos_yugioh/tests/calculator_verified_rules_test.cjs
          node torneos_yugioh/tests/calculator_battle_test.cjs
          node torneos_yugioh/tests/calculator_chain_resolution_test.cjs
      - name: Validate export and combo UI
        run: |
          node torneos_yugioh/tests/study_presentation_contract_test.cjs
          node torneos_yugioh/tests/study_presentation_ui_test.cjs
          node scripts/deck-analysis-ledger-test.cjs /tmp/station-x-gpt-decks/02_PROMPT_PARA_CODEX/contrato_tareas_a01_a10.json
          node torneos_yugioh/tests/study_crystron_visual_ui_test.cjs
          node torneos_yugioh/tests/deck_builder_study_photos_test.cjs
          node torneos_yugioh/tests/deck_export_test.cjs
          node torneos_yugioh/tests/combo_creator_study_photos_test.cjs
          node torneos_yugioh/tests/combo_editorial_library_test.cjs
          node torneos_yugioh/tests/documented_combo_editor_test.cjs

      - name: Verify the real Memento and Crystron A01-T5 guides in mobile and desktop browsers
        run: node torneos_yugioh/tests/study_presentation_ui_test.cjs /tmp/station-x-gpt-decks
      - name: Save A01-T5 screenshots and verified UI evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: memento-671-a01-t5-isolated-ui
          path: outputs/a01-t5-memento-671/
          if-no-files-found: error
          retention-days: 30

      - name: Save Crystron A01-T5 browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: crystron-677-a01-t5-isolated-ui
          path: outputs/a01-t5-crystron-677/
          if-no-files-found: error
          retention-days: 30

  p06-fast-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared P06 parity checks against GPT base
        run: |
          git clone --depth 1 --branch base https://github.com/senior23enginer-coder/gpt-yugioh-promps-platform.git /tmp/p06-gpt
          node torneos_yugioh/tests/deck_logic_fixture_runner_test.cjs
          node scripts/deck-paper-parity.cjs /tmp/p06-gpt/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-legacy-paper-cases.json
          node scripts/deck-legacy-route-trace-test.cjs /tmp/p06-gpt/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-memento-route-traces.json
          node scripts/deck-declarative-route-parity.cjs /tmp/p06-gpt/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-memento-c01-physical-route.json
          node scripts/run-p06-golden-routes.cjs /tmp/p06-gpt/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-memento-golden-route-states.json
          node scripts/export-p06-route-golden.cjs
          node scripts/export-p06-legacy-inventory.cjs
          node scripts/check-p06-legacy-assertions.cjs /tmp/p06-gpt/03_COMPROBACIONES_NO_IMPORTAR/fixtures/p06-protected-legacy-assertions.json
