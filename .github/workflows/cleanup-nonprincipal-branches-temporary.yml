name: Archive and remove obsolete nonprincipal branches
on:
  push:
    branches:
      - maintenance/cleanup-20261123
    paths:
      - .github/workflows/cleanup-nonprincipal-branches-temporary.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: archive-branch-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/cleanup-20261123
          fetch-depth: 1
      - name: Archive refs and delete nonprincipal branches only after all PRs are merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          default="$(gh api "repos/$repo" --jq .default_branch)"
          if [ "$default" != "base" ]; then
            echo "::error::Unexpected default branch $default; aborting"
            exit 1
          fi
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          if [ "$open_count" != 0 ]; then
            echo "::error::There are still $open_count open PRs; aborting"
            exit 1
          fi
          git ls-remote --heads origin | sort > /tmp/branches-before.txt
          grep -q 'refs/heads/base$' /tmp/branches-before.txt
          echo "=== BACKING UP ALL NONPRINCIPAL HEADS AS RECOVERY TAGS ==="
          archived=0
          while read -r sha ref; do
            branch="${ref#refs/heads/}"
            case "$branch" in
              base|main|master|develop) continue ;;
            esac
            tag="refs/tags/backup/branch-cleanup-20261123/$branch"
            gh api -X POST "repos/$repo/git/refs" -f "ref=$tag" -f "sha=$sha" >/dev/null
            archived=$((archived+1))
            echo "Archived $branch at $sha"
          done < /tmp/branches-before.txt
          echo "Archived $archived branch tips."
          echo "=== VERIFYING BRANCHES WERE NOT MODIFIED WHILE BACKING UP ==="
          git ls-remote --heads origin | sort > /tmp/branches-after.txt
          if ! cmp -s /tmp/branches-before.txt /tmp/branches-after.txt; then
            echo "::error::Branch references changed during backup. No branch was deleted."
            exit 1
          fi
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          if [ "$open_count" != 0 ]; then
            echo "::error::New PR opened during backup. No branch was deleted."
            exit 1
          fi
          echo "=== DELETING ONLY THE ARCHIVED NONPRINCIPAL BRANCHES ==="
          deleted=0
          while read -r sha ref; do
            branch="${ref#refs/heads/}"
            case "$branch" in
              base|main|master|develop|maintenance/cleanup-20261123) continue ;;
            esac
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            deleted=$((deleted+1))
            echo "Deleted $branch"
          done < /tmp/branches-before.txt
          echo "=== DELETING TEMPORARY CLEANUP BRANCH LAST ==="
          gh api -X DELETE "repos/$repo/git/refs/heads/maintenance/cleanup-20261123" >/dev/null
          deleted=$((deleted+1))
          echo "Deleted $deleted temporary/nonprincipal branches. Base retained."
          git ls-remote --heads origin
