name: Validate deck TXT template

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
      - name: Validate PHP parser and safe import contract
        run: |
          php -l torneos_yugioh/includes/decks/template-import.php
          php torneos_yugioh/tests/deck_template_test.php
      - name: Validate modal JavaScript
        run: node --check torneos_yugioh/assets/modules/deck-template/ui.js
