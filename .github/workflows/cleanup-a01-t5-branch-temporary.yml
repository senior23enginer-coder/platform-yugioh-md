name: Archive and clean A01-T5 merged working branch
on:
  push:
    branches:
      - test/a01-t5-memento671-isolated-20261123
    paths:
      - .github/workflows/cleanup-a01-t5-branch-temporary.yml
permissions:
  contents: write
jobs:
  archive-and-delete:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR merged, back up exact branch tip, then remove working branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="senior23enginer-coder/platform-yugioh-md"
          branch="test/a01-t5-memento671-isolated-20261123"
          merged="$(gh api "repos/$repo/pulls/45" --jq .merged)"
          test "$merged" = "true"
          main="$(gh api "repos/$repo" --jq .default_branch)"
          test "$main" = "base"
          sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
          tag="refs/tags/backup/a01-t5-20261123/$branch"
          gh api -X POST "repos/$repo/git/refs" -f "ref=$tag" -f "sha=$sha" >/dev/null
          verified="$(gh api "repos/$repo/git/ref/tags/backup/a01-t5-20261123/$branch" --jq '.object.sha')"
          test "$verified" = "$sha"
          gh api -X DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
          echo "Archived and deleted $branch; retained base and backup tag at $sha"
